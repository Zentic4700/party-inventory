<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!-- 5e item catalogue (optional). Keep items-data.js in the same folder. -->
<script src="items-data.js"></script>
<style>
:root{
  --bg:#ece0c5; --bg2:#e2d2b0; --panel:#f7efdc; --panel2:#efe3c8; --ink:#2b2118; --muted:#6e5c46;
  --gold:#9c7020; --gold2:#c9a14a; --line:#ccb88e; --line2:#b89e6c; --accent:#7d2e1f; --magic:#4f3a9a;
  --good:#3d6b35; --warn:#a5541b; --bad:#9b2c2c; --shadow:0 2px 10px rgba(60,40,10,.15);
  --r-common:#6b6b6b; --r-uncommon:#2f7d32; --r-rare:#2457a6; --r-veryrare:#7b3fb0; --r-legendary:#c26a12; --r-artifact:#a32020;
}
:root[data-theme="dark"]{
  --bg:#17120e; --bg2:#1f1813; --panel:#2a211a; --panel2:#33281f; --ink:#ece0c8; --muted:#a8977c;
  --gold:#d6ab52; --gold2:#e6c477; --line:#4a3b2c; --line2:#6a5440; --accent:#d26a4f; --magic:#b0a0ff;
  --good:#7fbf6a; --warn:#e09a55; --bad:#e06a6a; --shadow:0 2px 12px rgba(0,0,0,.5);
  --r-common:#b0b0b0; --r-uncommon:#6fcf74; --r-rare:#6fa4ff; --r-veryrare:#c08cff; --r-legendary:#ffab4a; --r-artifact:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Lora,Georgia,serif;
  background-image:radial-gradient(ellipse at top,rgba(255,255,255,.18),transparent 60%);min-height:100vh}
h1,h2,h3,h4,.cinzel{font-family:Cinzel,serif;letter-spacing:.03em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:5px 7px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:0}
input[type=checkbox]{accent-color:var(--gold)}
textarea{width:100%;resize:vertical}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:5px 11px}
button:hover{border-color:var(--gold)}
button.gold{background:linear-gradient(#c9a14a,#9c7020);color:#fff8e6;border-color:#7a5612;font-family:Cinzel,serif;font-weight:700}
button.gold:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{border-color:var(--line2)}
button.danger{color:var(--bad)}
button.small{padding:2px 8px;font-size:13px}
.muted{color:var(--muted)} .small{font-size:13px} .right{text-align:right} .nowrap{white-space:nowrap}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg2)}
:root{--gutter:64px;--drawer-w:min(680px,100vw)}
@media (max-width:760px){:root{--gutter:10px}}
.hrow{display:flex;align-items:center;gap:12px;padding:8px var(--gutter);flex-wrap:wrap}
body.gated main>section:not(#gate){display:none!important} body.gated nav.tabs{visibility:hidden} body.gated label:has(#meSel){visibility:hidden}
.gatep{max-width:560px;margin:30px auto;padding:18px 22px} .gatep p{margin:8px 0} .gatep .toolbar{margin:12px 0} .gatefoot{margin-top:16px!important;border-top:1px solid var(--line);padding-top:8px}
#syncBtn{position:relative} #syncBtn.req::after{content:attr(data-n);position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font:700 10px/15px sans-serif;text-align:center;padding:0 3px}
.reqn{display:inline-block;min-width:18px;border-radius:9px;background:var(--accent);color:#fff;font:700 11px/18px sans-serif;text-align:center;padding:0 5px;vertical-align:1px}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.online{display:inline-flex;gap:3px;align-items:center;cursor:default} .online:empty{display:none}
.odot{width:20px;height:20px;border-radius:50%;color:#fff;font:700 11px/20px sans-serif;text-align:center;box-shadow:0 0 0 2px var(--bg2)}
.srow.ros{grid-template-columns:150px 210px minmax(220px,1fr) 110px 44px;min-width:780px}
.rchars{display:flex;flex-wrap:wrap;gap:4px;align-items:center} .rchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:12px;padding:0 4px 0 2px;font-size:13px;background:var(--panel2)}
.rchip.on{border-color:var(--gold);font-weight:700} .rchip.ret{opacity:.6} .rchip button{border:0;background:none;padding:0 3px;cursor:pointer;color:var(--muted);font-size:12px} .rchip.on .rstar{color:var(--gold)}
.srow.pl.ret input{opacity:.6} .chip.ret{opacity:.6}
.ncell{display:flex;align-items:center;gap:8px} .nmain{flex:1;min-width:0}
.usebtn{flex:none;font-size:11px;padding:0 6px;border-radius:9px;line-height:16px;color:var(--good);border-color:currentColor;background:transparent;white-space:nowrap}
.ver{font-size:11px;color:var(--muted);white-space:nowrap;align-self:flex-start;margin-top:2px;opacity:.8}
.brand h1{font-size:20px;color:var(--gold)} .brand .camp{font-size:13px;color:var(--muted)}
.campsel{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:4px;padding:0 2px;margin-left:-3px;cursor:pointer;max-width:260px}
.campsel:hover,.campsel:focus{border-color:var(--line2);color:var(--ink)} .campsel option{background:var(--panel);color:var(--ink)}
.camplist{display:flex;flex-direction:column;gap:4px;margin:4px 0 6px} .camprow{display:flex;gap:8px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.camprow.on{border-color:var(--gold2)} .camprow .nm{flex:1;min-width:0} .camprow .nm b{font-family:Cinzel,serif} .camprow code{font-size:12px;color:var(--muted)}
.subh{font-size:13px;color:var(--gold);margin:14px 0 4px}
.spacer{flex:1}
.cloud{display:flex;align-items:center;gap:6px;font-size:13px}
.cloud button{font-size:18px;line-height:1;padding:3px 9px;color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--good)} .dot.busy{background:var(--gold2)} .dot.err{background:var(--bad)}
/* tabs: flat cards with slightly rounded tops; the active one takes the page colour and joins the content below */
:root{--tab:#d9c7a0;--tab-ink:#6e5c46}
:root[data-theme="dark"]{--tab:#2b221b;--tab-ink:#9d8c72}
nav.tabs{display:flex;gap:4px;padding:10px var(--gutter) 0;overflow-x:auto;overflow-y:hidden;align-items:flex-end;box-shadow:inset 0 -1px 0 var(--line2);scrollbar-width:thin}
nav.tabs button{display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:Lora,Georgia,serif;font-size:14px;font-weight:600;
  color:var(--tab-ink);background:var(--tab);border:1px solid rgba(0,0,0,.06);border-bottom:none;border-radius:4px 4px 0 0;
  padding:9px 16px 8px;margin-bottom:1px;box-shadow:0 1px 3px rgba(40,25,5,.22);transition:background .12s,color .12s}
nav.tabs button .ti{font-size:15px;opacity:.75;line-height:1}
nav.tabs button:hover{color:var(--ink);filter:brightness(1.04)}
nav.tabs button.on{background:var(--bg);color:var(--gold);padding:12px 18px 11px;margin-bottom:0;position:relative;z-index:1;
  border-color:var(--line2);box-shadow:0 -1px 4px rgba(40,25,5,.12)}
nav.tabs button.on .ti{opacity:1}
/* settings sub-tabs: same shape and colours as the main tabs */
nav.tabs.subtabs{padding:4px 0 0;margin:0 0 14px}
/* tag chips on the item card */
.tagbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--ink)}
.tchip{display:inline-flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:1px 4px 1px 9px;font-size:13px}
.tchip button{padding:0 4px;font-size:11px;line-height:16px;border:none;color:var(--muted)}
.tchip button:hover{color:var(--bad)}
.tagbox select{font-size:13px;padding:3px 6px;max-width:170px}
/* types & tags manager */
.vlistbox{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;padding-right:4px}
.vrow{display:grid;grid-template-columns:1fr 80px 32px;gap:8px;align-items:center}
.vrow input{padding:4px 7px}
.vcount{font-size:13px;cursor:pointer;text-decoration:underline dotted;text-align:right}
.vcount:hover{color:var(--gold)}
/* scroll to top / bottom */
#scrollNav{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:30;transition:right .2s ease}
#scrollNav button{width:36px;height:36px;border-radius:50%;padding:0;font-size:15px;line-height:1;color:#fff8e6;border:1px solid #7a5612;
  background:linear-gradient(#c9a14a,#9c7020);box-shadow:var(--shadow);opacity:.85}
#scrollNav button:hover{opacity:1}
#scrollNav button.dim{opacity:.3}
body.drawer-open #scrollNav{right:calc(var(--drawer-w) + 14px)}
@media (max-width:760px){body.drawer-open #scrollNav{display:none}}
main{padding:14px var(--gutter) 60px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px}
.panel>h2,.panel>h3{color:var(--gold);font-size:16px;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar label{display:flex;align-items:center;gap:5px;font-size:13px}
.toolbar input[type=search]{width:220px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.chip:hover{border-color:var(--gold)} .chip b{font-family:Cinzel,serif}
.chip .over{color:var(--bad);font-weight:600}
.pdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:Cinzel,serif;font-size:12px;text-align:left;padding:7px 8px;background:var(--panel2);border-bottom:2px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th.nosort{cursor:default}
th .arr{color:var(--gold)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.item:hover{background:rgba(201,161,74,.12);cursor:pointer}
tr.sel{background:rgba(201,161,74,.2)!important}
tr.grp td{background:var(--bg2);font-family:Cinzel,serif;font-weight:700;color:var(--gold);font-size:13px}
td.num{text-align:right;white-space:nowrap}
.iname{font-weight:600}
.badge{display:inline-block;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;line-height:16px;vertical-align:1px;white-space:nowrap}
.b-magic{color:var(--magic)} .b-att{color:var(--accent)} .b-eq{color:var(--good)} .b-unid{color:var(--warn)}
.rar-Common{color:var(--r-common)} .rar-Uncommon{color:var(--r-uncommon)} .rar-Rare{color:var(--r-rare)}
.rar-Very-Rare{color:var(--r-veryrare)} .rar-Legendary{color:var(--r-legendary)} .rar-Artifact{color:var(--r-artifact)}
.empty{padding:30px;text-align:center;color:var(--muted)}
tfoot td{font-weight:600;background:var(--panel2)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;margin:8px 0;background:var(--panel2);border:1px solid var(--gold2);border-radius:6px;font-size:14px}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer-w);background:var(--panel);border-left:2px solid var(--gold2);box-shadow:-4px 0 20px rgba(0,0,0,.25);z-index:40;overflow-y:auto;transform:translateX(105%);transition:transform .2s ease;padding:0 16px 30px}
.drawer.open{transform:none}
.dr-head{position:sticky;top:0;background:var(--panel);padding:12px 0 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:2}
.dr-head h3{flex:1;color:var(--gold);font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
.fgrid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.f>input,.f>select,.f>textarea,.f>.inl{font-size:14px;color:var(--ink)}
.f>select,.f>input:not([type=checkbox]):not([type=color]){width:100%}
.fgrid>*{min-width:0}
.inl.coins>label{flex:1;min-width:0} .inl.coins input{width:100%}
.inl{display:flex;gap:5px} .inl>input{flex:1;width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:flex;align-items:center;gap:5px}
.desc{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;max-height:320px;overflow:auto;color:var(--ink)}
.sect{margin-top:14px;padding-top:8px;border-top:1px dashed var(--line2)}
.sect h4{font-size:13px;color:var(--gold);margin-bottom:6px}
.catres{border:1px solid var(--line);border-radius:6px;max-height:260px;overflow:auto;margin-top:6px;background:var(--panel2)}
.catres div{padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.catres div:hover{background:rgba(201,161,74,.18)}
.warn{color:var(--warn);font-size:13px}
.view{padding-top:8px}
.vsub{font-style:italic;color:var(--muted);margin-bottom:4px}
.vlist{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:10px 0 0;font-size:14px}
.vlist dt{font-family:Cinzel,serif;font-size:12px;color:var(--muted);padding-top:2px}
.vlist dd{margin:0}
.vcont{margin:4px 0 8px;padding-left:20px;font-size:14px}
.vcont a{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
.vcont a:hover{color:var(--gold)}
.confirm{color:var(--bad);font-weight:600}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--gold2)}
.card:hover{border-color:var(--gold)}
.card h3{font-size:15px;display:flex;gap:6px;align-items:center}
.card .ico{color:var(--gold);font-size:17px}
.bar{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.hi{background:var(--warn)} .bar i.over{background:var(--bad)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-family:Cinzel,serif}
.crumbs a{color:var(--gold);cursor:pointer;text-decoration:underline}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:6px 0}
.stats b{font-family:Cinzel,serif;font-size:12px;color:var(--muted);font-weight:700;margin-right:4px}

/* settings */
.sgrid{overflow-x:auto}
.srow{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow>input,.srow>select{width:100%;min-width:0}
.srow.shead{font-size:12px;color:var(--muted);padding:2px 0 4px;border-bottom:1px solid var(--line2)}
.srow .c{display:flex;justify-content:center}
.srow input[type=color]{padding:0;height:31px;width:44px}
.srow.pl{grid-template-columns:200px 150px 64px 52px 104px minmax(160px,1fr) 104px;min-width:920px}
.srow.lo{grid-template-columns:200px 150px 220px 90px 90px 80px minmax(150px,1fr) 250px;min-width:1320px}
.rowbtns{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.itembadge,.rowbtns [data-set=lItem]{min-width:62px;text-align:center;font-size:12px;white-space:nowrap}
.rowbtns button.confirming{min-width:62px}
.itembadge{color:var(--gold);border:1px dashed var(--gold2);background:transparent}
.itembadge:hover{border-style:solid}
.srow .f input[type=color]{padding:0;height:31px;width:44px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.help{font-size:13px;color:var(--muted);margin:4px 0 8px}

/* currency */
.coins input{width:78px;text-align:right}
.coin-h{font-family:Cinzel,serif}
.c-pp{color:#7f8fa6} .c-gp{color:var(--gold)} .c-ep{color:#5f8f88} .c-sp{color:#8a8a8a} .c-cp{color:#a2582c}
.ledger{max-height:340px;overflow:auto;font-size:13px}
.ledger div{padding:4px 0;border-bottom:1px dotted var(--line)}

/* log */
.lgt{font-family:Cinzel,serif;font-size:12px;font-weight:700}
.lg-added{color:var(--good)} .lg-moved{color:var(--r-rare)} .lg-edited{color:var(--muted)} .lg-deleted{color:var(--bad)}
.lg-coins{color:var(--gold)} .lg-container{color:var(--magic)} .lg-settings{color:var(--warn)} .lg-note{color:var(--ink)}
.lg-archived{color:var(--warn)} .lg-returned{color:var(--good)} .b-arc{color:var(--muted);margin-right:6px}
details.sect>summary{cursor:pointer;list-style:none} details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary h4{display:inline;margin:0} details.sect>summary h4::before{content:'▸ ';color:var(--gold)} details.sect[open]>summary h4::before{content:'▾ '}
details.sect[open]>summary{margin-bottom:6px}
.hlist{list-style:none;padding:0;margin:0;font-size:13px} .hlist li{padding:3px 0;border-bottom:1px dotted var(--line)}
.arct td{vertical-align:top} .arct button{white-space:nowrap} .arclink{color:var(--gold);cursor:pointer;text-decoration:underline dotted}
.logt td{vertical-align:top}
.lglink{color:var(--ink);text-decoration:underline dotted;cursor:pointer} .lglink:hover{color:var(--gold)}
tr.lgedit td{background:var(--panel2)} tr.lgedit input,tr.lgedit select{font-size:13px;padding:3px 5px}
/* inline ✔ / ✖ confirm (same as the character sheet) */
button.confirming{background:var(--bad);border-color:var(--bad);color:#fff}
.cf-yes,.cf-no{font-size:1.1em;text-shadow:0 0 2px black;cursor:pointer;padding:0 3px}
.cf-yes{color:#4ade80} .cf-no{color:#fff} .cf-txt{color:#fff;font-size:12px}
/* quick number controls */
.qtyctl{display:inline-flex;align-items:center;gap:4px}
.qtyctl input{width:70px;text-align:center;padding:3px 5px}
td.qcell{white-space:nowrap}
table.itable{table-layout:fixed;min-width:980px}
table.itable td{overflow-wrap:anywhere}
table.itable th{overflow:hidden;text-overflow:ellipsis}
.qwrap{display:inline-grid;grid-template-columns:22px 56px 22px;align-items:center;justify-items:center}
.qwrap .qn{justify-self:center}
table.itable th.c,table.itable td.c{text-align:center}
.qb{margin:0}
.qb{padding:0 6px;font-size:12px;line-height:18px;margin:0 3px;opacity:0;transition:opacity .15s;background:var(--panel2)}
tr.item:hover .qb,.qb:focus{opacity:1}
@media (hover:none){.qb{opacity:1}}
#toast{position:fixed;left:16px;bottom:14px;background:var(--panel2);border:1px solid var(--gold2);border-radius:6px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.show{opacity:1}

@media (max-width:760px){
  .toolbar input[type=search]{width:100%}
  main{padding:10px 10px 60px}
  nav.tabs{padding-top:8px;gap:3px} nav.tabs button{padding:8px 10px 7px} nav.tabs button.on{padding:10px 12px 8px}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><h1>⚜ Group Inventory</h1><div class="camp" id="campName"></div><select id="campSel" class="campsel hidden" aria-label="Switch campaign" title="Switch campaign"></select></div>
    <div class="spacer"></div>
    <label class="small muted">I am <select id="meSel"></select></label>
    <span id="online" class="online"></span>
    <div class="cloud"><span class="dot" id="syncDot"></span><span id="syncText" class="muted">Local only</span>
      <button id="syncBtn" class="ghost" title="Live sync status">☁</button></div>
    <button id="themeBtn" class="ghost" title="Toggle parchment / leather theme">☾</button>
    <span class="ver" id="appVer"></span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="inv" class="on"><span class="ti">⚒</span>Inventory</button>
    <button data-tab="loc"><span class="ti">▣</span>Containers &amp; Locations</button>
    <button data-tab="cur"><span class="ti">◉</span>Currency</button>
