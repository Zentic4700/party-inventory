/* take `coins` from purse p; returns false if not enough value */
function takeCoins(p, coins, makeChange) {
  const exact = COINS.every(c => int(p[c]) >= int(coins[c]));
  if (exact) { COINS.forEach(c => p[c] = int(p[c]) - int(coins[c])); return true; }
  if (!makeChange) return false;
  const need = COINS.reduce((s, c) => s + int(coins[c]) * COIN_CP[c], 0);
  if (coinValue(p) < need) return false;
  // use the requested coins we do have, then pay the rest smallest coin first, getting change back
  let owed = 0;
  COINS.forEach(c => { const use = Math.min(int(p[c]), int(coins[c])); p[c] = int(p[c]) - use; owed += (int(coins[c]) - use) * COIN_CP[c]; });
  for (const c of ['cp', 'sp', 'ep', 'gp', 'pp']) {
    if (owed <= 0) break;
    const val = COIN_CP[c];
    if (val <= owed) { const k = Math.min(int(p[c]), Math.floor(owed / val)); p[c] -= k; owed -= k * val; }
    if (owed > 0 && owed < val && int(p[c]) > 0) {
      p[c] -= 1; let change = val - owed; owed = 0;
      p.gp = int(p.gp) + Math.floor(change / 100); change %= 100; p.sp = int(p.sp) + Math.floor(change / 10); p.cp = int(p.cp) + change % 10;
    }
  }
  return owed <= 0;
}

function bindCurrency() {
  const root = $('#tab-cur');
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.purse) { const p = ensurePurse(t.dataset.purse); p[t.dataset.coin] = int(t.value); touch(p); commit({ defer: true }); }
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-cur]'); if (!b) return;
    const msg = $('#txMsg');
    switch (b.dataset.cur) {
      case 'addPurse': { ensurePurse($('#newPurse').value); commit(); break; }
      case 'apply': {
        const from = $('#txFrom').value, to = $('#txTo').value;
        const coins = Object.fromEntries(COINS.map(c => [c, Math.max(0, int($(`[data-tx=${c}]`).value))]));
        if (!COINS.some(c => coins[c])) { msg.textContent = 'Enter an amount.'; return; }
        if (from === to) { msg.textContent = 'From and To are the same.'; return; }
        if (from) {
          const p = ensurePurse(from);
          const backup = Object.assign({}, p);
          if (!takeCoins(p, coins, $('#txChange').checked)) { Object.assign(p, backup); msg.textContent = `${holderName(from)} doesn't have enough.`; return; }
          touch(p);
        }
        if (to) { const p = ensurePurse(to); COINS.forEach(c => p[c] = int(p[c]) + coins[c]); touch(p); }
        const le = { id: uid('led'), ts: now(), fromId: from, toId: to, coins, note: $('#txNote').value.trim(), by: meName() }; touch(le); DB.ledger.push(le);
        logEvent('coins', { text: `${coinStr(coins)}: ${from ? holderName(from) : 'Outside'} → ${to ? holderName(to) : 'Outside'}`, note: le.note });
        commit(); toast('Transaction recorded'); break;
      }
      case 'split': {
        const ids = $$('[data-split]', root).filter(x => x.checked).map(x => x.dataset.split);
        if (!ids.length) return;
        const pf = ensurePurse('party'); const share = {};
        COINS.forEach(c => { share[c] = Math.floor(int(pf[c]) / ids.length); pf[c] = int(pf[c]) - share[c] * ids.length; });
        if (!COINS.some(c => share[c])) { toast('Nothing to split'); return; }
        touch(pf);
        ids.forEach(id => { const p = ensurePurse(id); COINS.forEach(c => p[c] = int(p[c]) + share[c]); touch(p);
          const le = { id: uid('led'), ts: now(), fromId: 'party', toId: id, coins: Object.assign({}, share), note: 'Split of Party Fund', by: meName() }; touch(le); DB.ledger.push(le); });
        logEvent('coins', { text: `Party Fund split between ${ids.map(holderName).join(', ')}: ${coinStr(share)} each` });
        commit(); toast(`Split between ${ids.length} characters`); break;
      }
    }
  });
}

function renameVocab(v, nw) {
  nw = nw.trim(); const old = v.name; if (!nw || nw === old) return false;
  const dup = vocabFind(v.kind, nw);
  DB.items.forEach(it => {
    if (v.kind === 'type' && (it.type || '').toLowerCase() === old.toLowerCase()) { it.type = dup ? dup.name : nw; touch(it); }
    if (v.kind === 'tag' && itemTags(it).some(t => t.toLowerCase() === old.toLowerCase())) { it.tags = Array.from(new Set(itemTags(it).map(t => t.toLowerCase() === old.toLowerCase() ? (dup ? dup.name : nw) : t))).join(', '); touch(it); }
  });
  if (dup && dup !== v) { DB.vocab = DB.vocab.filter(x => x !== v); tombstone(v.id); }   // merged into an existing one
  else { v.name = nw; touch(v); }
  logEvent('settings', { text: `${v.kind} renamed: ${old} → ${nw}${dup && dup !== v ? ' (merged)' : ''}` });
  return true;
}
function deleteVocab(v) {
  let n = 0;
  DB.items.forEach(it => {
    if (v.kind === 'type' && (it.type || '').toLowerCase() === v.name.toLowerCase()) { it.type = ''; touch(it); n++; }
    if (v.kind === 'tag' && itemTags(it).some(t => t.toLowerCase() === v.name.toLowerCase())) { it.tags = itemTags(it).filter(t => t.toLowerCase() !== v.name.toLowerCase()).join(', '); touch(it); n++; }
  });
  DB.vocab = DB.vocab.filter(x => x !== v); tombstone(v.id);

function moveOrder(list, id, dir) {
  const arr = list(); const i = arr.findIndex(x => x.id === id); const j = i + dir;

}

/* On a merge-import, characters and places that already exist here (same name) are reused instead of duplicated:
   the imported records are dropped and every reference to them is pointed at the existing ones. */
function matchByName(d) {
  const key = s => String(s || '').trim().toLowerCase();
  const map = {};
  const mine = { players: new Map(DB.players.map(p => [key(p.name), p.id])), locations: new Map(DB.locations.map(l => [key(l.name), l.id])) };
  for (const c of ['players', 'locations']) {
    d[c] = d[c].filter(r => { const id = mine[c].get(key(r.name)); if (id && id !== r.id) { map[r.id] = id; return false; } if (id) return false; return true; });
  }
  const m = id => map[id] || id;
  d.locations.forEach(l => l.parentId = m(l.parentId));
  d.items.forEach(i => i.holderId = m(i.holderId));
  d.purses.forEach(p => { if (map[p.holderId]) { p.holderId = m(p.holderId); p.id = 'cur_' + p.holderId; } });
  d.ledger.forEach(x => { x.fromId = m(x.fromId); x.toId = m(x.toId); });
  (d.archive || []).forEach(x => { if (x.archived) { x.archived.takenBy = m(x.archived.takenBy); x.archived.fromId = m(x.archived.fromId); } });
  return Object.keys(map).length;
}
function importFile(file) {
  if (!file) return;

    try {
      const d = normalizeDB(JSON.parse(r.result));
      let matched = 0;
      if (!$('#importMerge') || $('#importMerge').checked) { matched = matchByName(d); DB = normalizeDB(mergeDB(DB, d)); }
      else {
        // replace: everything not in the file is removed. An id can sit in a different list in the file
        // (e.g. archived here, active in the backup), so only ids missing from the whole file get a tombstone.
        const keep = new Set(COLS.flatMap(c => d[c].map(y => y.id)));
        const tomb = Object.assign({}, DB.tombstones, d.tombstones); COLS.forEach(c => DB[c].forEach(x => { if (!keep.has(x.id)) tomb[x.id] = now() + 1; }));
        keep.forEach(id => delete tomb[id]);
        const t = now() + 2; COLS.forEach(c => d[c].forEach(x => x.updatedAt = t)); d.meta.updatedAt = t;
        d.tombstones = tomb; DB = d;

      const n = d.items.length;
      logEvent('settings', { text: `data imported from file (${n} item${n === 1 ? '' : 's'}${matched ? `, ${matched} character/place name${matched === 1 ? '' : 's'} matched to existing` : ''})` });
      commit(); toast(`Imported ${n} items`);
    } catch (e) { toast('Import failed: ' + e.message); }
  };
  r.readAsText(file);
}

    .sort((a, b) => num(b.ts) - num(a.ts))[0];

function fmtChange(k, v) {

    if (f.types && f.types.length && !f.types.includes(e.action)) return false;
    if (f.by && (e.by || '') !== f.by) return false;
    if (num(e.ts) < from || num(e.ts) >= to) return false;
    if (q && ![e.itemName, logDetail(e), e.note, e.by, e.gameDate, LOG_TYPES[e.action]].join(' ').toLowerCase().includes(q)) return false;

function bindLog() {

  });
  root.addEventListener('change', e => {
    const t = e.target, f = prefs.logf;
    if (t.dataset.lgtype) { const s = new Set(f.types || []); t.checked ? s.add(t.dataset.lgtype) : s.delete(t.dataset.lgtype); f.types = Array.from(s); }
    else if (t.id === 'lgBy') f.by = t.value;
    else if (t.id === 'lgFrom') f.from = t.value;
    else if (t.id === 'lgTo') f.to = t.value;

    else return;

  });
  root.addEventListener('keydown', e => {
    if (e.target.closest('.lgedit') && e.key === 'Enter') { e.preventDefault(); root.querySelector('[data-log=save]')?.click(); }
    if (e.target.closest('.lgedit') && e.key === 'Escape') { e.stopPropagation(); logEditId = ''; renderLog(); }
  });
  root.addEventListener('click', e => {
    if (e.target.id === 'lgDir') { prefs.logf.dir = (prefs.logf.dir || -1) * -1; savePrefs(); renderLog(); return; }
    const gi = e.target.closest('[data-goitem]'); if (gi) { openItem(gi.dataset.goitem); return; }
    const b = e.target.closest('[data-log]'); if (!b) return;
    const id = b.dataset.id;
    switch (b.dataset.log) {
      case 'new': { const en = logEvent('note', { text: '' }); logEditId = en.id; commit({ keep: ['log'] }); prefs.logf.dir = -1; renderLog(); setTimeout(() => $('#leText')?.focus(), 20); break; }
      case 'clear': prefs.logf = { q: '', types: [], by: '', from: '', to: '', dir: prefs.logf.dir || -1 }; savePrefs(); renderLog(); break;
      case 'all': logShowAll = true; renderLog(); break;
      case 'csv': logCsv(filteredLog()); break;
      case 'edit': logEditId = id; renderLog(); setTimeout(() => $('#leText')?.focus(), 20); break;
      case 'cancel': {
        const en = DB.log.find(x => x.id === logEditId);
        if (en && en.action === 'note' && !en.text && !en.note && !en.itemName) { DB.log = DB.log.filter(x => x !== en); tombstone(en.id); logEditId = ''; commit(); break; }
        logEditId = ''; renderLog(); break;
      }
      case 'save': {
        const en = DB.log.find(x => x.id === id); if (!en) return;
        const ts = new Date($('#leTs').value).getTime();
        if (isFinite(ts)) en.ts = ts;
        en.gameDate = $('#leGame').value.trim(); en.by = $('#leBy').value.trim(); en.action = $('#leAct').value;
        en.itemName = $('#leItem').value.trim();
        const txt = $('#leText').value.trim();
        const auto = (() => { const c = Object.assign({}, en, { text: '' }); return logDetail(c); })();
        en.text = txt === auto ? '' : txt;
        if (en.action === 'note' && !en.text && !txt) en.text = '';
        en.note = $('#leNote').value.trim();
        touch(en); logEditId = ''; commit(); toast('Log entry saved'); break;
      }
      case 'del': {
        if (!armed(b)) return;
        DB.log = DB.log.filter(x => x.id !== id); tombstone(id); if (logEditId === id) logEditId = ''; commit(); toast('Log entry deleted'); break;
      }
      case 'delShown': {
        const list = filteredLog();
        if (!armed(b, '', `Delete ${list.length}?`)) return;
        const ids = new Set(list.map(x => x.id)); DB.log = DB.log.filter(x => !ids.has(x.id)); ids.forEach(tombstone);
        commit(); toast(`Deleted ${ids.size} log entr${ids.size === 1 ? 'y' : 'ies'}`); break;
      }
    }
  });
}

/* =================== FIREBASE LIVE SYNC ===================
   Remote layout: campaigns/<code>/ { meta, tombstones, players/<id>, locations/<id>, items/<id>, purses/<id>, ledger/<id>, log/<id>, vocab/<id> }
   Every local commit is diffed against the last state we saw from the server (BASE) and only the changed
   fields are written. qty and coins are written as increments, so simultaneous changes add up. */
const FB_VER = '12.18.0';
const FB_CONFIG = {
  apiKey: 'AIzaSyBKlvrqsiN8eNmAMGKj4101OyB5z_hULOI',
  authDomain: 'dnd-zentic.firebaseapp.com',

  projectId: 'dnd-zentic',
  storageBucket: 'dnd-zentic.firebasestorage.app',
  messagingSenderId: '499715115328',
  appId: '1:499715115328:web:7b53d65ffcf81b2e6792a5'
};
const INC_FIELDS = { items: ['qty'], purses: COINS, archive: ['qty'] };

let FB = null, fbRef = null, fbUnsub = null, fbConnUnsub = null;
let BASE = null, fbLatest, fbApplyT, fbOnline = false, fbPending = 0, fbLastErr = '';

function fbCleanCode(s) { const c = String(s || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, ''); return c.length >= 8 ? c.slice(0, 60) : ''; }
function fbNewCode(name) {
  const slug = vslug(name || DB.meta.name || 'party').replace(/[^a-z0-9-]/g, '').slice(0, 20) || 'party';
  const r = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  return slug + '-' + r;

async function fbLoad() {
  if (FB) return FB;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, authM, dbM] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-database.js'].map(f => import(base + f)));
  const app = appM.initializeApp(FB_CONFIG);
  const auth = authM.getAuth(app);
  FB = Object.assign({ db: dbM.getDatabase(app), auth, A: authM }, dbM);
  await new Promise(res => {
    let first = true;
    authM.onAuthStateChanged(auth, u => {
      if (u && u.isAnonymous) { authM.signOut(auth); return; }   // left over from the old anonymous version
      const changed = (u ? u.uid : '') !== (fbUser ? fbUser.uid : '');
      fbUser = u || null;
      if (first) { first = false; res(); } else if (changed) fbAuthChanged();
    });
  });
  return FB;
}

/* ---------- local <-> remote shape ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function stableJ(v) {
  if (v === undefined || v === null || (typeof v === 'number' && !isFinite(v))) return 'null';
  if (Array.isArray(v)) return '[' + v.map(stableJ).join(',') + ']';
  if (typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined && v[k] !== null).sort().map(k => JSON.stringify(k) + ':' + stableJ(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
const fbKeyOk = k => typeof k === 'string' && k !== '' && !/[.#$\[\]\/]/.test(k);
/* Firebase keys can't be empty or contain . # $ [ ] / — drop such keys anywhere in a value */
function fbClean(v) {
  if (Array.isArray(v)) return v.map(fbClean);
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).filter(([k]) => fbKeyOk(k)).map(([k, x]) => [k, fbClean(x)]));
  return v;
}
function toRemote(db) {
  const d = clone(db), out = { app: 'group-inventory', version: APP_VERSION, meta: fbClean(d.meta || {}), tombstones: fbClean(d.tombstones || {}) };
  COLS.forEach(c => { out[c] = Object.fromEntries((d[c] || []).filter(r => r && fbKeyOk(r.id)).map(r => [r.id, fbClean(r)])); });
  return out;
}
function fromRemote(v) {
  v = v || {};
  const d = { meta: v.meta || {}, tombstones: v.tombstones || {} };
  // a record without its id is a leftover field-write onto something that was deleted meanwhile: drop it
  COLS.forEach(c => { d[c] = Object.values(v[c] || {}).filter(r => r && typeof r === 'object' && r.id); });
  return normalizeDB(mergeDB(d, { meta: { updatedAt: -1 } }));   // applies tombstones + stable order
}

/* field-level diff → multi-path update object */
function fbDiff(base, cur) {
  const up = {};
  const keys = (a, b) => new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys(base.meta, cur.meta)) if (fbKeyOk(k) && stableJ(base.meta?.[k]) !== stableJ(cur.meta?.[k])) up['meta/' + k] = fbClean(cur.meta?.[k] ?? null);
  for (const k of keys(base.tombstones, cur.tombstones)) if (fbKeyOk(k) && base.tombstones?.[k] !== cur.tombstones?.[k]) up['tombstones/' + k] = cur.tombstones?.[k] ?? null;
  for (const c of COLS) {
    const bm = new Map((base[c] || []).map(r => [r.id, r]));
    const inc = INC_FIELDS[c] || [];
    for (const r of (cur[c] || [])) {
      const b = bm.get(r.id); bm.delete(r.id);
      if (!r || !fbKeyOk(r.id)) continue;
      if (!b) { up[`${c}/${r.id}`] = fbClean(r); continue; }
      for (const k of keys(b, r)) {
        if (!fbKeyOk(k) || stableJ(b[k]) === stableJ(r[k])) continue;
        const path = `${c}/${r.id}/${k}`;
        if (inc.includes(k) && typeof b[k] === 'number' && typeof r[k] === 'number') up[path] = FB.increment(r[k] - b[k]);
        else up[path] = fbClean(r[k] ?? null);
      }
    }
    for (const id of bm.keys()) if (fbKeyOk(id)) up[`${c}/${id}`] = null;
  }
  return up;
}

/* push local changes (called from commit). Returns true if something was sent. */
function fbPush() {
  if (!fbRef || !BASE || !FB) return false;
  const cur = clone(DB), up = fbDiff(BASE, cur);
  BASE = cur;
  if (!Object.keys(up).length) { idleStatus(); return false; }
  fbPending++; idleStatus();
  if (up['meta/name'] !== undefined && fbRole === 'owner' && DB.meta.name) {
    FB.set(fbR(`campaigns/${prefs.fb.campaign}/name`), DB.meta.name).catch(() => { });
    FB.set(fbR(`users/${fbUser.uid}/campaigns/${prefs.fb.campaign}`), DB.meta.name).catch(() => { });
  }
  FB.update(fbRef, up).then(() => { fbLastErr = ''; }, e => { console.error(e); fbLastErr = e.code === 'PERMISSION_DENIED' ? 'Not allowed — check database rules' : e.message; })
    .finally(() => { fbPending--; idleStatus(); });
  return true;
}
function pushChanges() { if (!fbPush()) idleStatus(); }

function fbOnValue(snap) { fbLatest = snap.val(); clearTimeout(fbApplyT); fbApplyT = setTimeout(fbApply, 0); }
function fbApply() {
  if (!fbRef) return;
  if (fbPush()) { fbApplyT = setTimeout(fbApply, 30); return; }   // never drop a local edit: send it first, then take the server state
  if (fbLatest == null) { setStatus('err', 'No data in this campaign'); return; }
  const before = canon(DB);
  DB = fromRemote(fbLatest); BASE = clone(DB);
  if (syncLinked() | ensureVocab()) fbPush();
  saveLocal();
  const ent = fbEntry(prefs.fb.campaign);
  if (ent && DB.meta.name && ent.name !== DB.meta.name) { ent.name = DB.meta.name; savePrefs(); renderHeader(); }
  if (canon(DB) !== before) refreshAfterRemote();
  fbResolveMe();
  idleStatus();
}

const fbR = path => path ? FB.ref(FB.db, path) : FB.ref(FB.db);   // '' is not a valid path: no argument = the root

function fbAuthMsg(e) {
  switch (e && e.code) {

    case 'auth/unauthorized-domain': return `Add ${location.hostname} in Firebase → Authentication → Settings → Authorized domains`;

}
function bindGate() {

/* ask the DM for access (writes requests/<uid>) */

/* ---------- players & logins (roster), "I am", who's online ----------

}

}

/* DM: players who got in before the roster existed get a roster entry, so they can be linked to characters */
function fbRosterBackfill() {

  const code = prefs.fb.campaign, me = fbUser.uid, up = {};
  Object.entries(fbMembers).forEach(([uid, m]) => {

    const ek = emailKey(m.email); if (!fbKeyOk(ek) || fbRoster[ek]) return;

}

  Object.entries(fbMembers).forEach(([uid, m]) => {

function rosterSection() {

    <div class="toolbar" style="margin-top:8px"><input id="rosName" placeholder="Player name" style="width:150px"><input id="rosEmail" placeholder="their.name@gmail.com" style="flex:1;min-width:200px" autocomplete="off">

function bindRoster() {

    const ek = b.dataset.ek, r = ek && fbRoster[ek], pid = b.dataset.pid;

      case 'star': if (r) FB.set(rosterRef(ek, 'active'), r.active === pid ? '' : pid).catch(msg); break;
      case 'unchar': if (r) { const up = { [`chars/${pid}`]: null }; if (r.active === pid) up.active = Object.keys(r.chars || {}).find(id => id !== pid && getPlayer(id) && !getPlayer(id).retired) || ''; FB.update(rosterRef(ek), up).catch(msg); } break;

/* ---------- who's online ---------- */
function fbPresenceStart(code) {
  const uid = fbUser.uid, conn = Math.random().toString(36).slice(2, 10);
  fbPresRef = fbR(`campaigns/${code}/presence/${uid}/${conn}`);
  fbWatch.push(FB.onValue(fbR('.info/connected'), s => {
    if (!s.val() || !fbPresRef) return;
    FB.onDisconnect(fbPresRef).remove().then(fbPresenceUpdate, () => { });
  }, () => { }));
  fbWatch.push(FB.onValue(fbR(`campaigns/${code}/presence`), s => { fbOnlineMap = s.val() || {}; renderOnline(); }, () => { }));
}
function fbPresenceUpdate() {

}
function fbPresenceStop() {

}
function renderOnline() {
  const el = $('#online'); if (!el) return;
  const me = fbUser ? fbUser.uid : '', cut = Date.now() - 12 * 3600e3;
  const people = Object.entries(fbOnlineMap).filter(([uid]) => uid !== me).map(([, conns]) => {
    const v = Object.values(conns || {}).filter(c => c && (typeof c.at !== 'number' || c.at > cut)).sort((a, b) => (b.at || 0) - (a.at || 0))[0];
    return v || null;
  }).filter(Boolean).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (!people.length) { el.innerHTML = ''; el.title = ''; return; }

  const label = v => v.as && v.as !== v.name ? `${v.name} — as ${v.as}` : v.name;
  el.innerHTML = people.slice(0, 6).map(v => `<span class="odot" style="background:${esc(colorOf(v))}">${esc(String(v.name || '?').trim().charAt(0).toUpperCase())}</span>`).join('') + (people.length > 6 ? `<span class="small muted">+${people.length - 6}</span>` : '');
  el.title = 'Online now: ' + people.map(label).join(', ');
}

const fbEntry = code => prefs.fb.list.find(c => c.code === code);
function fbRemember(code, name) {

}
/* show this campaign's local copy right away (switching campaigns parks the current one) */
function fbSwitchLocal(code, data) {
  const switching = code !== prefs.fb.campaign;
  if (switching) {
    if (!fbGate) saveLocal();                         // park the current campaign's local copy
    fbDisconnect();
    if (prefs.fb.campaign) prefs.fb.me[prefs.fb.campaign] = prefs.me;
    prefs.fb.campaign = code;
    prefs.me = prefs.fb.me[code] || '';

    sel.clear(); openLoc = ''; if (drawer.mode) closeDrawer();

/* connect to (or switch to) a campaign. opts.create + opts.data: upload data as a new campaign (DM account only) */
async function fbConnect(code, opts = {}) {
  setStatus('busy', 'Connecting…');
  try { await fbLoad(); }
  catch (e) { idleStatus(); throw new Error('Could not reach Firebase: ' + (e.code || e.message)); }
  if (opts.create) {                                   // check before touching the local view
    if (!fbUser) throw new Error('Sign in with Google first');
    if (!fbIsCreator()) throw new Error('Only the DM account can create campaigns');
    const ex = await FB.get(fbR(`campaigns/${code}/owner`));
    if (ex.exists()) throw new Error('That campaign code is already in use');

        [`campaigns/${code}/data`]: toRemote(opts.data || DB),

        [`users/${uid}/campaigns/${code}`]: name

  }
  fbSwitchLocal(code, opts.data);
  if (!fbUser) { fbPendingCode = code; fbSetGate({ state: 'signin', code }); return; }
  fbPendingCode = '';
  const uid = fbUser.uid;
  let owner = null, name = '', member = null;
  try {
    const [o, n, m] = await Promise.all([FB.get(fbR(`campaigns/${code}/owner`)), FB.get(fbR(`campaigns/${code}/name`)), FB.get(fbR(`campaigns/${code}/members/${uid}`))]);
    owner = o.val(); name = n.val() || ''; member = m.val();
  } catch (e) {
    if (!isDenied(e)) { fbSetGate({ state: 'error', code, msg: 'Could not open the campaign: ' + (e.code || e.message) }); return; }
  }

  if (!owner) {                                        // wrong code, or a campaign from before sign-in
    fbSetGate({ state: fbIsCreator() && (DB.items.length || DB.archive.length) ? 'legacy' : 'notfound', code });
    return;
  }
  fbRemember(code, name); savePrefs(); renderHeader();
  if (!member && fbUser.emailVerified) {               // on the DM's list of players? then straight in, no approval
    let ros = null;
    try { ros = (await FB.get(fbR(`campaigns/${code}/roster/${emailKey(fbUser.email)}`))).val(); } catch (e) { }
    if (ros) {
      try { await FB.update(fbR(''), { [`campaigns/${code}/members/${uid}`]: fbMe(), [`users/${uid}/campaigns/${code}`]: name || code }); member = true; }
      catch (e) { console.warn('self-join failed', e); }
    }

    let req = null;
    try { req = (await FB.get(fbR(`campaigns/${code}/requests/${uid}`))).val(); } catch (e) { }
    if (req) { fbSetGate({ state: 'waiting', code, name }); fbWatchApproval(code); }
    else if (prefs.fb.asked[code]) { fbSetGate({ state: 'declined', code, name }); fbWatchApproval(code); }

    return;
  }
  // a member: go live
  delete prefs.fb.asked[code]; savePrefs();
  fbRole = owner === uid ? 'owner' : 'member';
  fbSetGate(null);
  fbRef = fbR(`campaigns/${code}/data`); BASE = null;
  fbUnsub = FB.onValue(fbRef, fbOnValue, e => { setStatus('err', 'Live sync stopped: ' + (e.code || e.message)); });
  fbConnUnsub = FB.onValue(fbR('.info/connected'), s => { fbOnline = !!s.val(); idleStatus(); });
  fbWatch.push(FB.onValue(fbR(`campaigns/${code}/members/${uid}`), s => {
    if (!s.exists() && fbRef) { fbDisconnect(); prefs.fb.asked[code] = true; savePrefs(); fbSetGate({ state: 'removed', code, name }); }
  }, () => { }));
  const updSet = () => { renderHeader(); if (prefs.tab === 'set' && (prefs.setTab === 'sync' || prefs.setTab === 'chars')) renderSettings(); };
  fbWatch.push(FB.onValue(fbR(`campaigns/${code}/roster`), s => {
    fbRoster = s.val() || {}; fbRosterLoaded = true; fbRosterBackfill(); fbResolveMe(); fbPresenceUpdate(); updSet();
  }, () => { fbRoster = {}; }));
  fbPresenceStart(code);
  if (fbRole === 'owner') {
    fbWatch.push(FB.onValue(fbR(`campaigns/${code}/requests`), s => { fbReqs = s.val() || {}; updSet(); }, () => { }));
    fbWatch.push(FB.onValue(fbR(`campaigns/${code}/members`), s => { fbMembers = s.val() || {}; fbMembersLoaded = true; fbRosterBackfill(); updSet(); }, () => { }));
  } else {
    FB.get(fbR(`campaigns/${code}/members`)).then(s => { fbMembers = s.val() || {}; }, () => { fbMembers = {}; });
  }
  FB.set(fbR(`users/${uid}/campaigns/${code}`), name || code).catch(() => { });   // keep my list in my account
  renderHeader(); if (prefs.tab === 'set') renderSettings();
  idleStatus();
}
/* remove a campaign from this browser's list (the campaign itself is untouched) */
function fbForget(code) {
  prefs.fb.list = prefs.fb.list.filter(c => c.code !== code);
  delete prefs.fb.me[code];
  if (fbUser && FB && !(fbRole === 'owner' && code === prefs.fb.campaign)) FB.set(fbR(`users/${fbUser.uid}/campaigns/${code}`), null).catch(() => { });
  if (code === prefs.fb.campaign) {
    fbDisconnect(); dropLocal(code); fbSetGate(null);
    const next = prefs.fb.list[0];
    prefs.fb.campaign = ''; prefs.me = '';
    savePrefs();
    if (next) { fbConnect(next.code).catch(fbShowErr); return; }
    DB = loadLocal('') || seedDB(); renderAll(); idleStatus();
  } else { dropLocal(code); savePrefs(); renderAll(); }
}
function fbDisconnect() {
  if (fbUnsub) fbUnsub(); if (fbConnUnsub) fbConnUnsub();
  fbPresenceStop();
  fbUnwatch();
  fbRoster = {}; fbRosterLoaded = fbMembersLoaded = false;
  fbUnsub = fbConnUnsub = null; fbRef = null; BASE = null; fbOnline = false; fbRole = ''; fbReqs = {}; fbMembers = {}; clearTimeout(fbApplyT);
}

function setStatus(state, text) {
  const d = $('#syncDot'); d.className = 'dot ' + (state || '');
  $('#syncText').textContent = text;
}
function idleStatus() {
  if (!prefs.fb.campaign) return setStatus('', 'Local only');
  if (fbGate) return setStatus(fbGate.state === 'waiting' ? 'busy' : 'err',
    { signin: 'Sign in needed', waiting: 'Waiting for approval', declined: 'No access', removed: 'No access', legacy: 'Old campaign', notfound: 'Campaign not found' }[fbGate.state] || 'Error');
  if (!fbRef) return setStatus('err', 'Not connected — click ☁');
  if (fbLastErr) return setStatus('err', fbLastErr.slice(0, 60));
  if (!BASE) return setStatus('busy', 'Loading…');
  if (!fbOnline) return setStatus('busy', 'Offline · changes kept');
  if (fbPending) return setStatus('busy', 'Saving…');
  setStatus('ok', 'Live' + (fbRole === 'owner' ? ' · DM' : ''));
}

/* re-render, but don't clobber what the user is typing */
function refreshAfterRemote() {
  const ae = document.activeElement;
  const typingIn = ae && ae.matches && ae.matches('input,textarea,select') ? ae.closest('section,aside') : null;
  const keep = [];
  if (typingIn && typingIn.id && typingIn.id.startsWith('tab-')) keep.push(typingIn.id.slice(4));
  renderAll(keep);
  if (drawer.mode === 'edit' || drawer.mode === 'view') {
    const nowArc = !getItem(drawer.id) && !!getArc(drawer.id);
    if (!getItem(drawer.id) && !nowArc) { closeDrawer(); toast('That item was removed by someone else'); }
    else if (nowArc !== !!drawer.arc) { drawer.arc = nowArc; drawer.mode = 'view'; renderDrawer(); }
    else if (!(typingIn && typingIn.id === 'drawer')) renderDrawer();
  }
}

/* =================== HEADER / TABS / INIT =================== */
function applyTheme() { document.documentElement.setAttribute('data-theme', prefs.theme === 'dark' ? 'dark' : 'light'); }
function renderHeader() {
  const nReq = fbRole === 'owner' ? Object.keys(fbReqs).length : 0, sb = $('#syncBtn');
  sb.classList.toggle('req', nReq > 0); sb.dataset.n = nReq || '';
  sb.title = nReq ? `${nReq} player${nReq === 1 ? '' : 's'} waiting for access — click to see` : 'Live sync status';
  const list = prefs.fb.list, multi = list.length > 1, cs = $('#campSel');
  $('#campName').textContent = DB.meta.name || '';
  $('#campName').classList.toggle('hidden', multi);
  cs.classList.toggle('hidden', !multi);
  if (multi && document.activeElement !== cs)
    cs.innerHTML = list.map(c => `<option value="${esc(c.code)}" ${c.code === prefs.fb.campaign ? 'selected' : ''}>${esc(c.code === prefs.fb.campaign ? (DB.meta.name || c.name || c.code) : (c.name || c.code))}</option>`).join('')
      + '<option value="__add">＋ Join / create campaign…</option>';
  $('#meSel').innerHTML = meOptions();
  renderOnline();
  document.title = (DB.meta.name ? DB.meta.name + ' · ' : '') + 'Group Inventory';
}
function showTab(t) {
  prefs.tab = t; savePrefs(); sel.clear();
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['inv', 'loc', 'cur', 'arc', 'log', 'set'].forEach(x => $('#tab-' + x).classList.toggle('hidden', x !== t));
  if (t === 'loc') openLoc = openLoc || '';
  renderTab(t);
}
function renderTab(t) {
  if (t === 'inv') renderInventory();
  else if (t === 'loc') renderLocations();
  else if (t === 'cur') renderCurrency();
  else if (t === 'arc') renderArchive();
  else if (t === 'set') renderSettings();
  else if (t === 'log') renderLog();
}
/* render header + visible tab (unless listed in keep) */
function renderAll(keep = []) {
  renderHeader();
  if (!keep.includes(prefs.tab)) renderTab(prefs.tab);
  else if (prefs.tab === 'inv') { /* nothing */ }
}

function readUrlParams() {
  try {
    const u = new URL(location.href), c = fbCleanCode(u.searchParams.get('c') || '');
    if (u.searchParams.has('c')) { u.searchParams.delete('c'); history.replaceState(null, '', u.toString()); }
    return c;
  } catch (e) { return ''; }
}

async function init() {
  $('#appVer').textContent = 'v' + APP_BUILD; $('#appVer').title = `Group Inventory v${APP_BUILD} (${APP_BUILD_DATE})`;
  console.info(`Group Inventory v${APP_BUILD} (${APP_BUILD_DATE})`);
  loadPrefs(); applyTheme();
  if (!SORTERS[prefs.sort.key]) prefs.sort.key = 'name';
  if (!['', 'req', 'none'].includes(prefs.filters.attune)) prefs.filters.attune = '';
  if (!prefs.arcf || typeof prefs.arcf !== 'object') prefs.arcf = { q: '', reason: '', who: '', dir: -1 };
  const urlCode = readUrlParams();
  if (!Array.isArray(prefs.fb.list)) prefs.fb.list = [];
  if (!prefs.fb.me || typeof prefs.fb.me !== 'object') prefs.fb.me = {};
  if (!prefs.fb.asked || typeof prefs.fb.asked !== 'object') prefs.fb.asked = {};
  if (prefs.fb.campaign) {
    fbRemember(prefs.fb.campaign);
    // older single-campaign version kept its copy under the plain key: move it
    if (!loadLocal() && loadLocal('')) { try { localStorage.setItem(lsDataKey(), localStorage.getItem(lsDataKey(''))); localStorage.removeItem(lsDataKey('')); } catch (e) { } }
    if (prefs.fb.me[prefs.fb.campaign] !== undefined) prefs.me = prefs.fb.me[prefs.fb.campaign];
  }
  const local = loadLocal();
  if (local) DB = local;
  DB = normalizeDB(DB);
  if (syncLinked() | ensureVocab()) saveLocal();
  bindInventory(); bindDrawer(); bindLocations(); bindCurrency(); bindSettings(); bindLog(); bindArchive(); bindGate(); bindRoster();
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { if (b.dataset.tab === 'loc') openLoc = ''; showTab(b.dataset.tab); } });
  $('#meSel').addEventListener('change', e => setMe(e.target.value));
  $('#themeBtn').addEventListener('click', () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); if (prefs.tab === 'set') renderSettings(); });
  $('#syncBtn').addEventListener('click', () => {
    if (!prefs.fb.campaign) { prefs.setTab = 'sync'; showTab('set'); setTimeout(() => $('#fbCode')?.focus(), 30); toast('Set up live sync first'); }
    else if (fbRole === 'owner' && Object.keys(fbReqs).length) { prefs.setTab = 'sync'; showTab('set'); }
    else if (fbGate) toast($('#syncText').textContent);
    else if (!fbRef) fbConnect(prefs.fb.campaign).catch(fbShowErr);
    else toast(fbOnline ? 'Live — changes are saved instantly' : 'Offline — changes are kept and sent when you reconnect');
  });
  window.addEventListener('beforeunload', e => { if (fbPending > 0) { e.preventDefault(); e.returnValue = ''; } });
  $('#toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  $('#toBottom').addEventListener('click', () => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }));
  const navVis = () => { const el = document.documentElement, can = el.scrollHeight > window.innerHeight + 40;
    $('#toTop').classList.toggle('dim', window.scrollY < 40); $('#toBottom').classList.toggle('dim', window.scrollY + window.innerHeight > el.scrollHeight - 40);
    $('#scrollNav').classList.toggle('hidden', !can); };
  window.addEventListener('scroll', navVis, { passive: true }); window.addEventListener('resize', navVis);
  new MutationObserver(() => requestAnimationFrame(navVis)).observe($('main'), { childList: true, subtree: true });
  showTab(prefs.tab || 'inv');
  idleStatus();
  const startCode = urlCode || prefs.fb.campaign;
  if (startCode) fbConnect(startCode).then(() => fbSyncMyList(), e => { console.error(e); setStatus('err', e.message.slice(0, 60)); if (urlCode) toast('Could not open campaign: ' + e.message); });
  else if (location.protocol !== 'file:') fbLoad().then(() => { if (fbUser) fbSyncMyList(); renderHeader(); if (prefs.tab === 'set') renderSettings(); }, () => { });
  $('#campSel').addEventListener('change', e => {
    const v = e.target.value;
    if (v === '__add') { e.target.value = prefs.fb.campaign; prefs.setTab = 'sync'; showTab('set'); setTimeout(() => $('#fbCode')?.focus(), 30); return; }
    if (v !== prefs.fb.campaign) fbConnect(v).catch(er => { toast(er.message); renderHeader(); });
  });
}
init();

</script>
</body>
