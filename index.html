<script>
'use strict';
/* =========================================================
   GROUP INVENTORY — D&D 5e shared party inventory
   Data: one JSON document, synced live through Firebase
   Realtime Database (field-level writes, coins/qty as increments).
   ========================================================= */
const APP_VERSION = 1;          // data format version (not the app build)
const APP_BUILD = '2.4.2';     // shown top right — bump on every change
const APP_BUILD_DATE = '2026-10-18';
const LS_DATA = 'groupInvFb_data_v1';
const LS_PREFS = 'groupInvFb_prefs_v1';
const COLS = ['players', 'locations', 'items', 'purses', 'ledger', 'log', 'vocab', 'archive'];
const COINS = ['pp', 'gp', 'ep', 'sp', 'cp'];
const COIN_CP = { pp: 1000, gp: 100, ep: 50, sp: 10, cp: 1 };
const RARITIES = ['Mundane', 'Common', 'Uncommon', 'Rare', 'Very Rare', 'Legendary', 'Artifact', 'Varies', 'Unknown'];
const RAR_ORDER = Object.fromEntries(RARITIES.map((r, i) => [r, i]));
const LOC_KINDS = { location: '⌂ Location', container: '▣ Container', vehicle: '☸\uFE0E Vehicle', mount: '♞ Mount' };
const LOC_ICON = { location: '⌂', container: '▣', vehicle: '☸\uFE0E', mount: '♞' };
const CORE_2014 = ["Player's Handbook (2014)", "Dungeon Master's Guide (2014)", 'Monster Manual (2014)'];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const num = (v, d = 0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const int = (v, d = 0) => { const n = parseInt(v, 10); return isFinite(n) ? n : d; };

/* ---------- catalogue ---------- */
const CATALOG = (typeof myItems !== 'undefined' && Array.isArray(myItems)) ? myItems : [];
const CAT_BY_INDEX = new Map(CATALOG.map(c => [c.index, c]));

/* ---------- data model ---------- */
function seedDB() {
  const t = 1;
  return {
    app: 'group-inventory', version: APP_VERSION,
    meta: { name: 'Party Inventory', coinWeight: true, coinsPerLb: 50, updatedAt: t },
    players: [],
    locations: [
      { id: 'loc_camp', name: 'Camp / Base', kind: 'location', parentId: '', capacity: null, selfWeight: 0, weightless: true, notes: '', order: 1, updatedAt: t },
      { id: 'loc_wagon', name: 'Wagon', kind: 'vehicle', parentId: 'loc_camp', capacity: null, selfWeight: 0, weightless: true, notes: '', order: 2, updatedAt: t }
    ],
    items: [],
    purses: [{ id: 'cur_party', holderId: 'party', pp: 0, gp: 0, ep: 0, sp: 0, cp: 0, updatedAt: t }],
    ledger: [],
    log: [],
    vocab: [],
    archive: [],
    tombstones: {}
  };
}

function normalizeDB(d) {
  const db = Object.assign(seedDB(), d || {});
  db.meta = Object.assign(seedDB().meta, db.meta || {});
  COLS.forEach(c => { if (!Array.isArray(db[c])) db[c] = []; });
  if (!db.tombstones || typeof db.tombstones !== 'object') db.tombstones = {};
  db.items.forEach(it => {
    it.qty = num(it.qty, 1); it.weightEach = it.weightEach == null || it.weightEach === '' ? null : num(it.weightEach);
    it.valueCp = it.valueCp == null || it.valueCp === '' ? null : num(it.valueCp);
    it.holderId = it.holderId || ''; it.updatedAt = it.updatedAt || 0;
    if (it.identified === undefined) it.identified = true;
    delete it.attunedTo; // attunement is tracked on character sheets, not here
  });
  db.players.forEach((p, i) => { if (p.order == null) p.order = i; p.updatedAt = p.updatedAt || 0; });
  db.locations.forEach((l, i) => { if (l.order == null) l.order = i; l.kind = l.kind || 'location'; l.parentId = l.parentId || ''; l.updatedAt = l.updatedAt || 0; });
  db.purses.forEach(p => COINS.forEach(c => p[c] = int(p[c])));
  return db;
}

/* Per-record merge: newest updatedAt wins; tombstones delete. Deterministic output. */
function mergeDB(local, remote) {
  if (!remote) return local;
  if (!local) return remote;
  const out = { app: 'group-inventory', version: APP_VERSION };
  out.meta = (num(local.meta?.updatedAt) > num(remote.meta?.updatedAt)) ? local.meta : remote.meta;
  const tomb = {};
  for (const src of [remote.tombstones || {}, local.tombstones || {}])
    for (const [k, v] of Object.entries(src)) tomb[k] = Math.max(tomb[k] || 0, v);
  out.tombstones = Object.fromEntries(Object.keys(tomb).sort().map(k => [k, tomb[k]]));
  for (const c of COLS) {
    const m = new Map();
    for (const r of (remote[c] || [])) m.set(r.id, r);
    for (const r of (local[c] || [])) {
      const e = m.get(r.id);
      if (!e || num(r.updatedAt) > num(e.updatedAt)) m.set(r.id, r);
    }
    out[c] = Array.from(m.values())
      .filter(r => !(tomb[r.id] && tomb[r.id] >= num(r.updatedAt)))
      .sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  }
  return out;
}
const canon = db => JSON.stringify(mergeDB(db, { meta: { updatedAt: -1 } }));

/* ---------- state ---------- */
let DB = seedDB();
let prefs = {
  theme: 'light', me: '', tab: 'inv',
  fb: { campaign: '', list: [], me: {}, asked: {} },
  filters: { q: '', holder: '', nested: true, type: '', rarity: '', magic: '', attune: '', tag: '' },
  sort: { key: 'name', dir: 1 }, group: 'none',
  logf: { q: '', types: [], by: '', from: '', to: '', dir: -1 },
  arcf: { q: '', reason: '', who: '', dir: -1 },
  setTab: 'chars'
};
const sel = new Set();          // selected item ids (bulk actions)
let openLoc = '';               // container view: holder id currently open

function loadPrefs() {
  try { const p = JSON.parse(localStorage.getItem(LS_PREFS) || 'null'); if (p) prefs = deepMerge(prefs, p); } catch (e) { }
  ['gh', 'autoSync', 'pollSec'].forEach(k => delete prefs[k]);   // settings from the old GitHub-sync version
}
function savePrefs() {
  if (prefs.fb.campaign) prefs.fb.me[prefs.fb.campaign] = prefs.me;   // "I am" is remembered per campaign
  try { localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); } catch (e) { }
}
/* each campaign has its own local copy; '' = local-only data */
const lsDataKey = (code = prefs.fb.campaign) => code ? LS_DATA + ':' + code : LS_DATA;
function saveLocal() { try { localStorage.setItem(lsDataKey(), JSON.stringify(DB)); } catch (e) { } }
function loadLocal(code = prefs.fb.campaign) {
  try { const d = JSON.parse(localStorage.getItem(lsDataKey(code)) || 'null'); return d ? normalizeDB(d) : null; } catch (e) { return null; }
}
function dropLocal(code) { try { localStorage.removeItem(lsDataKey(code)); } catch (e) { } }
function deepMerge(a, b) {
  const o = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  for (const k in b) o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') ? deepMerge(a[k], b[k]) : b[k];
  return o;
}

function meName() { if (prefs.me === 'self') return mySelfName(); const p = getPlayer(prefs.me); return p ? p.name : (prefs.me === 'dm' ? 'DM' : ''); }
function touch(rec) { rec.updatedAt = now(); rec.updatedBy = meName(); return rec; }
function tombstone(id) { DB.tombstones[id] = now() + 1; }

/* commit: persist + schedule sync + re-render (opts.keep = tab names NOT to re-render) */
/* Containers are always also items, so they show up in a character's list.
   A container made from an item follows that item around. Returns true if anything changed. */
function syncLinked() {
  let changed = false;
  DB.locations.slice().forEach(l => {
    if (!getLoc(l.id)) return;
    if (l.itemId && !getItem(l.itemId) && DB.tombstones[l.itemId]) { removeLocation(l.id); changed = true; return; }
    if (l.kind === 'container' && !l.noItem && !(l.itemId && getItem(l.itemId))) {
      const id = 'itl_' + l.id;
      const it = Object.assign(blankItem(l.parentId), { id, name: l.name || 'Container', type: 'Container', weightEach: num(l.selfWeight) || null, createdAt: now() });
      touch(it); DB.items.push(it); l.itemId = id; l.selfWeight = 0; touch(l); changed = true;
    }
    if (!l.itemId) return;
    const it = getItem(l.itemId); if (!it) return;
    if (it.holderId === l.id || descendantsOf(l.id).has(it.holderId)) { it.holderId = l.parentId; touch(it); changed = true; return; }
    if (l.parentId !== it.holderId) { l.parentId = it.holderId; touch(l); changed = true; }
    if (l.name !== it.name && it.name) { l.name = it.name; touch(l); changed = true; }
  });
  return changed;
}
/* ---------- types & tags (shared list, managed in Settings) ---------- */
const DEFAULT_TYPES = ['Weapon', 'Armor', 'Shield', 'Ammunition', 'Wondrous Item', 'Potion', 'Scroll', 'Ring', 'Wand', 'Staff', 'Rod',
  'Adventuring Gear', 'Tool', 'Treasure', 'Trade Good', 'Container', 'Mount', 'Misc'];
const vslug = n => String(n).trim().toLowerCase().replace(/[^a-z0-9æøåäöü]+/g, '-').replace(/^-|-$/g, '') || 'x';
const vocabId = (kind, n) => 'voc_' + (kind === 'type' ? 't' : 'g') + '_' + vslug(n);
function vocabList(kind) { return DB.vocab.filter(v => v.kind === kind).sort((a, b) => a.name.localeCompare(b.name)); }
function vocabFind(kind, n) { const k = String(n).trim().toLowerCase(); return DB.vocab.find(v => v.kind === kind && v.name.trim().toLowerCase() === k); }
function itemTags(it) { return String(it.tags || '').split(',').map(s => s.trim()).filter(Boolean); }
function addVocab(kind, n) {
  n = String(n || '').trim(); if (!n) return null;
  let v = vocabFind(kind, n); if (v) return v;
  v = { id: vocabId(kind, n), kind, name: n }; touch(v); DB.vocab.push(v); return v;
}
/* anything used on an item is always in the list; first run gets a sensible starter set of types */
function ensureVocab() {
  let changed = false;
  if (!DB.vocab.some(v => v.kind === 'type') && !Object.keys(DB.tombstones).some(k => k.startsWith('voc_t_')))
    DEFAULT_TYPES.forEach(t => { addVocab('type', t); changed = true; });
  DB.items.forEach(it => {
    if (it.type && !vocabFind('type', it.type)) { addVocab('type', it.type); changed = true; }
    itemTags(it).forEach(t => { if (!vocabFind('tag', t)) { addVocab('tag', t); changed = true; } });
  });
  return changed;
}
/* delete an item everywhere (card, bulk delete…). If it is a container, the container goes too
   and whatever was inside is moved to where the item was. */
function deleteItem(it) {
  if (!it) return;
  logItem('deleted', it, { fromId: it.holderId });
  DB.locations.filter(l => l.itemId === it.id).forEach(l => removeLocation(l.id, it.holderId));
  DB.items = DB.items.filter(x => x.id !== it.id); tombstone(it.id); sel.delete(it.id);
}
/* delete a location/container; whatever was inside goes to `dest` (default: where it was kept) */
function removeLocation(id, dest) {
  const l = getLoc(id); if (!l) return;
  if (dest === undefined) dest = l.parentId || '';
  DB.items.forEach(it => { if (it.holderId === id) { it.holderId = dest; touch(it); } });
  DB.locations.forEach(x => { if (x.parentId === id) { x.parentId = dest; touch(x); } });
  const pu = purseOf(id);
  if (pu) { if (coinValue(pu)) { const pf = ensurePurse('party'); COINS.forEach(c => pf[c] = int(pf[c]) + int(pu[c])); touch(pf); } DB.purses = DB.purses.filter(x => x !== pu); tombstone(pu.id); }
  DB.locations = DB.locations.filter(x => x.id !== id); tombstone(id);
  if (openLoc === id) openLoc = '';
}
function commit(opts = {}) {
  syncLinked(); ensureVocab(); saveLocal(); pushChanges();
  if (opts.defer) setTimeout(() => {   // after focus has moved (Tab), re-render and put focus back
    const ae = document.activeElement, sel = selectorFor(ae);
    renderAll(); if (sel) { const el = document.querySelector(sel); if (el) { el.focus(); try { el.select && el.select(); } catch (e) { } } }
  }, 0);
  else renderAll(opts.keep || []);
}
function selectorFor(el) {
  if (!el || el === document.body || !el.matches || !el.matches('input,select,textarea,button')) return null;
  if (el.id) return '#' + el.id;
  const a = Array.from(el.attributes).filter(x => x.name.startsWith('data-')).map(x => `[${x.name}="${String(x.value).replace(/"/g, '\\"')}"]`).join('');
  return a ? el.tagName.toLowerCase() + a : null;
}

/* ---------- lookups ---------- */
const getPlayer = id => DB.players.find(p => p.id === id);
const getLoc = id => DB.locations.find(l => l.id === id);
const getItem = id => DB.items.find(i => i.id === id);
const sortedPlayers = () => DB.players.slice().sort((a, b) => num(a.order) - num(b.order) || a.name.localeCompare(b.name));
const sortedLocs = () => DB.locations.slice().sort((a, b) => num(a.order) - num(b.order) || a.name.localeCompare(b.name));

function holderName(id) {
  if (!id) return 'Unassigned';
  if (id === 'party') return 'Party Fund';
  if (id === ARCHIVE_ID) return 'Archive';
  const p = getPlayer(id); if (p) return p.name || '(unnamed)';
  const l = getLoc(id); if (l) return l.name || '(unnamed)';
  return '(removed)';
}
/* chain of holders from the outermost down to id */
function holderPath(id) {
  const path = []; const seen = new Set(); let cur = id;
  while (cur && !seen.has(cur)) {
    seen.add(cur); path.unshift(cur);
    const l = getLoc(cur); cur = l ? l.parentId : '';
  }
  return path;
}
function holderLabel(id) {
  const p = holderPath(id);
  if (p.length <= 1) return holderName(id);
  return holderName(id) + ' ‹ ' + p.slice(0, -1).reverse().map(holderName).join(' ‹ ');
}
function isWithin(holderId, targetId) { return holderPath(holderId).includes(targetId); }
function descendantsOf(locId) {
  const out = new Set(); const st = [locId];
  while (st.length) { const c = st.pop(); DB.locations.forEach(l => { if (l.parentId === c && !out.has(l.id)) { out.add(l.id); st.push(l.id); } }); }
  return out;
}

/* ---------- weight / value ---------- */
const itemWeight = it => num(it.qty) * num(it.weightEach);
const itemValue = it => num(it.qty) * num(it.valueCp);
function purseOf(holderId) { return DB.purses.find(p => p.holderId === holderId); }
function coinCount(p) { return p ? COINS.reduce((s, c) => s + int(p[c]), 0) : 0; }
function coinValue(p) { return p ? COINS.reduce((s, c) => s + int(p[c]) * COIN_CP[c], 0) : 0; }

/* weight this holder is burdened with (stops at weightless containers) */
function holderLoad(id, seen = new Set()) {
  if (seen.has(id)) return 0; seen.add(id);
  let w = 0;
  DB.items.forEach(it => { if (it.holderId === id) w += itemWeight(it); });
  DB.locations.forEach(l => { if (l.parentId === id) w += num(l.selfWeight) + (l.weightless ? 0 : holderLoad(l.id, seen)); });
  if (DB.meta.coinWeight) w += coinCount(purseOf(id)) / (num(DB.meta.coinsPerLb, 50) || 50);
  return w;
}
/* everything inside (all nesting, ignores weightless) */
function holderContentsWeight(id, seen = new Set()) {
  if (seen.has(id)) return 0; seen.add(id);
  let w = 0;
  DB.items.forEach(it => { if (it.holderId === id) w += itemWeight(it); });
  DB.locations.forEach(l => { if (l.parentId === id) w += num(l.selfWeight) + holderContentsWeight(l.id, seen); });
  return w;
}
function holderValue(id) { return DB.items.reduce((s, it) => s + (isWithin(it.holderId, id) ? itemValue(it) : 0), 0); }
function holderCount(id) { return DB.items.reduce((s, it) => s + (isWithin(it.holderId, id) ? 1 : 0), 0); }
function capacityOf(id) {
  const p = getPlayer(id); if (p) return num(p.str) ? num(p.str) * 15 : null;
  const l = getLoc(id); return l && num(l.capacity) ? num(l.capacity) : null;
}

/* ---------- formatting ---------- */
function fmtW(w) { if (!w) return '—'; return (+w.toFixed(2)) + ' lb'; }
function fmtCp(cp) {
  cp = num(cp); if (!cp) return '—';
  if (cp >= 100) return (+(cp / 100).toFixed(2)).toLocaleString('en-US') + ' gp';
  if (cp >= 10 && cp % 10 === 0) return (cp / 10) + ' sp';
  return cp + ' cp';
}
function fmtGp(cp) { return (+(num(cp) / 100).toFixed(2)).toLocaleString('en-US') + ' gp'; }
function fmtTime(t) { if (!t || t < 1000) return ''; const d = new Date(t); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
const rarClass = r => 'rar-' + String(r || '').replace(/\s+/g, '-');

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* option builders */
function holderOptions(selected, opts = {}) {
  const exclude = opts.exclude || new Set();
  const kids = new Map();
  sortedLocs().forEach(l => { const p = (getPlayer(l.parentId) || getLoc(l.parentId)) ? l.parentId : ''; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(l); });
  const pad = n => '\u00A0\u00A0\u00A0'.repeat(n);
  const opt = (id, label, depth) => exclude.has(id) ? '' : `<option value="${esc(id)}" ${id === selected ? 'selected' : ''}>${pad(depth)}${label}</option>`;
  const tree = (pid, depth, seen = new Set()) => (kids.get(pid) || []).filter(l => !seen.has(l.id) && !exclude.has(l.id))
    .map(l => { seen.add(l.id); return opt(l.id, `${LOC_ICON[l.kind] || ''} ${esc(l.name || '(unnamed)')}`, depth) + tree(l.id, depth + 1, seen); }).join('');
  let h = opts.none !== false ? `<option value="">${esc(opts.noneLabel || '— Unassigned —')}</option>` : '';
  if (opts.party) h += `<option value="party" ${selected === 'party' ? 'selected' : ''}>Party Fund</option>`;
  const pl = sortedPlayers().filter(p => !exclude.has(p.id) && (!p.retired || opts.retired || p.id === selected));
  if (pl.length) h += '<optgroup label="Characters (and what they carry)">' + pl.map(p => opt(p.id, esc(p.name || '(unnamed)') + (p.retired ? ' (retired)' : ''), 0) + tree(p.id, 1)).join('') + '</optgroup>';
  const top = tree('', 0);
  if (top) h += '<optgroup label="Locations &amp; vehicles">' + top + '</optgroup>';
  return h;
}
function playerOptions(selected, noneLabel = '— none —') {
  return `<option value="">${esc(noneLabel)}</option>` + sortedPlayers().filter(p => !p.retired || p.id === selected).map(p => `<option value="${esc(p.id)}" ${p.id === selected ? 'selected' : ''}>${esc(p.name || '(unnamed)')}</option>`).join('');
}
function valueParts(cp) {
  if (cp == null || cp === '') return { v: '', u: 'gp' };
  cp = num(cp);
  if (cp % 100 === 0 || cp >= 100) return { v: +(cp / 100).toFixed(2), u: 'gp' };
  if (cp % 10 === 0) return { v: cp / 10, u: 'sp' };
  return { v: cp, u: 'cp' };
}

/* =================== INVENTORY TAB =================== */
function filteredItems() {
  const f = prefs.filters; const q = (f.q || '').trim().toLowerCase();
  return DB.items.filter(it => {
    if (q && !([it.name, it.tags, it.notes, it.type, holderName(it.holderId)].join(' ').toLowerCase().includes(q))) return false;
    if (f.holder) {
      if (f.holder === '__none') { if (it.holderId) return false; }
      else if (f.nested ? !isWithin(it.holderId, f.holder) : it.holderId !== f.holder) return false;
    }
    if (f.type && (it.type || '') !== f.type) return false;
    if (f.rarity && (it.rarity || '') !== f.rarity) return false;
    if (f.magic === 'magic' && !it.magical) return false;
    if (f.magic === 'mundane' && it.magical) return false;
    if (f.attune === 'req' && !it.attunement) return false;
    if (f.attune === 'none' && it.attunement) return false;
    if (f.tag && !String(it.tags || '').split(',').map(s => s.trim().toLowerCase()).includes(f.tag.toLowerCase())) return false;
    return true;
  });
}
const SORTERS = {
  name: it => (it.name || '').toLowerCase(),
  qty: it => num(it.qty),
  weight: it => itemWeight(it),
  value: it => itemValue(it),
  holder: it => holderLabel(it.holderId).toLowerCase(),
  type: it => (it.type || '').toLowerCase(),
  rarity: it => RAR_ORDER[it.rarity] ?? -1,
  updated: it => num(it.updatedAt)
};
function sortItems(list) {
  const k = SORTERS[prefs.sort.key] || SORTERS.name; const d = prefs.sort.dir;
  return list.sort((a, b) => { const x = k(a), y = k(b); return (x < y ? -1 : x > y ? 1 : 0) * d || (a.name || '').localeCompare(b.name || ''); });
}
function groupKey(it) {
  switch (prefs.group) {
    case 'holder': return holderLabel(it.holderId);
    case 'owner': { const p = holderPath(it.holderId)[0]; return p ? holderName(p) : 'Unassigned'; }
    case 'type': return it.type || 'Other';
    case 'rarity': return it.rarity || '—';
    case 'magic': return it.magical ? 'Magic items' : 'Mundane items';
    default: return '';
  }
}

/* consumables get a "use 1" button: it goes to the archive as "used up", so it shows in the history */
const CONSUMABLE_TYPES = new Set(['Potion', 'Scroll', 'Ammunition']);
const isConsumable = it => !!it && (CONSUMABLE_TYPES.has(it.type) || itemTags(it).some(t => /^consumables?$/i.test(t)) || /\b(potion|scroll|elixir|philter|oil of)\b/i.test(it.name || ''));
function useOne(it) {
  if (!it || num(it.qty) <= 0) return;
  const who = getPlayer(prefs.me) ? prefs.me : '';
  // a second use soon after adds to the same "used up" entry instead of making a new one each time (arrows!)
  const ex = num(it.qty) > 1 && DB.archive.find(x => x.archived && x.archived.reason === 'used' && x.archived.srcId === it.id && (x.archived.takenBy || '') === who && now() - num(x.archived.at) < 12 * 3600e3);
  if (ex) {
    it.qty = +(num(it.qty) - 1).toFixed(4); touch(it);
    ex.qty = num(ex.qty) + 1; ex.archived = Object.assign({}, ex.archived, { at: now() }); touch(ex);
    logItem('archived', ex, { qty: 1, relId: it.id, fromId: it.holderId, text: `used up${who ? ' by ' + holderName(who) : ''} · ${+num(it.qty).toFixed(2)} left at ${holderLabel(it.holderId)}` });
  } else archiveItem(it, { qty: 1, reason: 'used', takenBy: who });
  commit();
  if (drawer.mode === 'view' && drawer.id === it.id) { if (getItem(it.id)) renderDrawer(); else closeDrawer(); }
  toast(`Used 1 × ${it.name}${getItem(it.id) ? ` — ${+num(it.qty).toFixed(2)} left` : ' — that was the last one'}`);
}
function itemBadges(it) {
  let b = '';
  if (it.magical) b += '<span class="badge b-magic" title="Magic item">✦ magic</span>';
  if (it.attunement) b += `<span class="badge b-att" title="Requires attunement${it.attuneNote ? ' ' + esc(it.attuneNote) : ''}">◈ attune</span>`;
  if (it.equipped) b += '<span class="badge b-eq">equipped</span>';
  if (it.identified === false) b += '<span class="badge b-unid">unidentified</span>';
  const lk = DB.locations.find(l => l.itemId === it.id);
  if (lk) b += `<span class="badge" style="color:var(--gold)" title="Container — ${holderCount(lk.id)} items inside">▣ ${holderCount(lk.id)}</span>`;
  if (num(it.chargesMax)) b += `<span class="badge muted">${int(it.charges)}/${int(it.chargesMax)} ch</span>`;
  return b;
}
function itemRow(it, cols) {
  const cells = {
    sel: `<td><input type="checkbox" data-sel="${esc(it.id)}" ${sel.has(it.id) ? 'checked' : ''}></td>`,
    name: `<td><div class="ncell"><div class="nmain"><span class="iname">${esc(it.name || '(unnamed)')}</span>${itemBadges(it)}${it.tags ? `<div class="small muted">${esc(it.tags)}</div>` : ''}</div>${isConsumable(it) && num(it.qty) > 0 ? `<button class="usebtn" data-use="${esc(it.id)}" title="Use one — it goes to the archive as used up">use 1</button>` : ''}</div></td>`,
    qty: `<td class="num qcell c"><span class="qwrap"><button class="qb" data-q="-1" data-id="${esc(it.id)}" title="One less">−</button><span class="qn">${esc(+num(it.qty).toFixed(2))}</span><button class="qb" data-q="1" data-id="${esc(it.id)}" title="One more">+</button></span></td>`,
    wEach: `<td class="num muted c">${fmtW(num(it.weightEach))}</td>`,
    weight: `<td class="num c">${fmtW(itemWeight(it))}</td>`,
    value: `<td class="num c" title="${it.valueCp ? 'each ' + fmtCp(it.valueCp) : ''}">${fmtCp(itemValue(it))}</td>`,
    holder: `<td class="c">${esc(holderLabel(it.holderId))}</td>`,
    type: `<td class="small c">${esc(it.type || '')}</td>`,
    rarity: `<td class="small c ${rarClass(it.rarity)}">${esc(it.rarity && it.rarity !== 'Mundane' ? it.rarity : '')}</td>`
  };
  return `<tr class="item ${sel.has(it.id) ? 'sel' : ''}" data-item="${esc(it.id)}">${cols.map(c => cells[c]).join('')}</tr>`;
}
const COL_W = { sel: '36px', qty: '124px', wEach: '82px', weight: '86px', value: '96px', holder: '210px', type: '150px', rarity: '96px' };
const INV_COLS = [['sel', ''], ['name', 'Name'], ['qty', 'Quantity'], ['wEach', 'Wt each'], ['weight', 'Weight'], ['value', 'Value'], ['holder', 'Carried by / Location'], ['type', 'Type'], ['rarity', 'Rarity']];
const CENTER_COLS = new Set(['qty', 'wEach', 'weight', 'value', 'holder', 'type', 'rarity']);
const SORTABLE = { name: 'name', qty: 'qty', weight: 'weight', value: 'value', holder: 'holder', type: 'type', rarity: 'rarity' };

function itemsTable(list, cols, opts = {}) {
  const head = cols.map(c => {
    const label = (INV_COLS.find(x => x[0] === c) || [c, c])[1];
    if (c === 'sel') return `<th class="nosort"><input type="checkbox" data-selall ${list.length && list.every(i => sel.has(i.id)) ? 'checked' : ''}></th>`;
    const sk = SORTABLE[c];
    const cc = CENTER_COLS.has(c) ? ' c' : '';
    if (!sk || opts.nosort) return `<th class="nosort${cc}">${label}</th>`;
    const arr = prefs.sort.key === sk ? `<span class="arr">${prefs.sort.dir > 0 ? '▲' : '▼'}</span>` : '';
    return `<th data-sort="${sk}"${cc ? ' class="c"' : ''}>${label} ${arr}</th>`;
  }).join('');
  let body = '';
  if (!list.length) body = `<tr><td colspan="${cols.length}" class="empty">${opts.empty || 'No items.'}</td></tr>`;
  else if (prefs.group !== 'none' && !opts.nogroup) {
    const groups = new Map();
    list.forEach(it => { const g = groupKey(it); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(it); });
    Array.from(groups.keys()).sort((a, b) => a.localeCompare(b)).forEach(g => {
      const gl = groups.get(g);
      const w = gl.reduce((s, i) => s + itemWeight(i), 0), v = gl.reduce((s, i) => s + itemValue(i), 0);
      body += `<tr class="grp"><td colspan="${cols.length}">${esc(g)} <span class="muted small">· ${gl.length} item${gl.length === 1 ? '' : 's'} · ${fmtW(w)} · ${fmtCp(v)}</span></td></tr>`;
      body += gl.map(it => itemRow(it, cols)).join('');
    });
  } else body = list.map(it => itemRow(it, cols)).join('');
  const tw = list.reduce((s, i) => s + itemWeight(i), 0), tv = list.reduce((s, i) => s + itemValue(i), 0);
  const foot = list.length ? `<tfoot><tr>${cols.map(c => c === 'name' ? `<td>${list.length} item${list.length === 1 ? '' : 's'}</td>` : c === 'weight' ? `<td class="num c">${fmtW(tw)}</td>` : c === 'value' ? `<td class="num c">${fmtCp(tv)}</td>` : c === 'qty' ? `<td class="num qcell c"><span class="qwrap"><span></span><span class="qn">${+list.reduce((s, i) => s + num(i.qty), 0).toFixed(2)}</span><span></span></span></td>` : '<td></td>').join('')}</tr></tfoot>` : '';
  // fixed column widths so nothing shifts when a number changes
  const colg = '<colgroup>' + cols.map(c => `<col${COL_W[c] ? ` style="width:${COL_W[c]}"` : ''}>`).join('') + '</colgroup>';
  return `<div class="tablewrap"><table class="itable">${colg}<thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}

function bulkBar() {
  const ids = Array.from(sel).filter(id => getItem(id));
  if (!ids.length) return '';
  return `<div class="bulk"><b>${ids.length} selected</b> · Move to <select id="bulkTo">${holderOptions('')}</select>
    <button data-act="bulkMove">Move</button>
    <span class="small muted">·</span> <select id="bulkArReason" title="Archive reason">${Object.entries(ARC_REASONS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
    <select id="bulkArWho" title="Who">${playerOptions(getPlayer(prefs.me) ? prefs.me : '', '— nobody —')}</select>
    <button data-act="bulkArc">⚱ Archive</button>
    <button data-act="bulkDel" class="danger">Delete</button>
    <button data-act="bulkClear" class="ghost">Clear selection</button></div>`;
}

function playerChips() {
  const pl = sortedPlayers().filter(p => !p.retired || holderCount(p.id) || coinValue(purseOf(p.id)));   // retired ones only while they still hold something
  if (!pl.length) return `<div class="chips"><span class="muted small">No characters yet — add your party in <a href="#" data-goto="set">Settings</a>.</span></div>`;
  return '<div class="chips">' + pl.map(p => {
    const load = holderLoad(p.id), cap = capacityOf(p.id);
    return `<div class="chip ${p.retired ? 'ret' : ''}" data-chip="${esc(p.id)}" title="Show what ${esc(p.name)} carries${p.retired ? ' (retired)' : ''}">
      <span class="pdot" style="background:${esc(p.color || '#9c7020')}"></span><b>${esc(p.name || '(unnamed)')}</b>${p.retired ? ' <i class="small">retired</i>' : ''}
      <span class="${cap && load > cap ? 'over' : ''}">${fmtW(load)}${cap ? ' / ' + cap + ' lb' : ''}</span>
</div>`;
  }).join('') + '</div>';
}

function renderInventory() {
  const f = prefs.filters;
  const types = Array.from(new Set(DB.items.map(i => i.type).filter(Boolean))).sort();
  const tags = Array.from(new Set(DB.items.flatMap(i => String(i.tags || '').split(',').map(s => s.trim()).filter(Boolean)))).sort();
  const list = sortItems(filteredItems());
  const active = Object.entries(f).some(([k, v]) => k !== 'nested' && v);
  $('#tab-inv').innerHTML = `
    ${playerChips()}
    <div class="panel"><div class="toolbar">
      <button class="gold" data-act="newItem">+ Add item</button>
      <input type="search" id="fQ" placeholder="Search name, tag, notes…" value="${esc(f.q)}">
      <label>Who / where <select id="fHolder"><option value="">All</option><option value="__none" ${f.holder === '__none' ? 'selected' : ''}>Unassigned</option>${holderOptions(f.holder, { none: false, retired: true })}</select></label>
      <label title="Also show items inside containers carried/stored there"><input type="checkbox" id="fNested" ${f.nested ? 'checked' : ''}> incl. containers</label>
      <label>Type <select id="fType"><option value="">All</option>${types.map(t => `<option ${t === f.type ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <label>Rarity <select id="fRarity"><option value="">All</option>${RARITIES.map(r => `<option ${r === f.rarity ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
      <label>Magic <select id="fMagic"><option value="">All</option><option value="magic" ${f.magic === 'magic' ? 'selected' : ''}>Magic only</option><option value="mundane" ${f.magic === 'mundane' ? 'selected' : ''}>Mundane only</option></select></label>
      <label>Attunement <select id="fAttune"><option value="">All</option><option value="req" ${f.attune === 'req' ? 'selected' : ''}>Requires attunement</option><option value="none" ${f.attune === 'none' ? 'selected' : ''}>No attunement</option></select></label>
      ${tags.length ? `<label>Tag <select id="fTag"><option value="">All</option>${tags.map(t => `<option ${t === f.tag ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>` : ''}
      <label>Sort <select id="sKey">${[['name', 'Name'], ['qty', 'Quantity'], ['weight', 'Weight'], ['value', 'Value'], ['holder', 'Carried by / Location'], ['type', 'Type'], ['rarity', 'Rarity'], ['updated', 'Last changed']].map(([k, l]) => `<option value="${k}" ${prefs.sort.key === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="small" id="sDir" title="Toggle direction">${prefs.sort.dir > 0 ? '▲' : '▼'}</button></label>
      <label>Group <select id="gKey">${[['none', 'None'], ['holder', 'Carried by / Location'], ['owner', 'Owner (top level)'], ['type', 'Type'], ['rarity', 'Rarity'], ['magic', 'Magic / mundane']].map(([k, l]) => `<option value="${k}" ${prefs.group === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${active ? '<button class="ghost small" data-act="clearFilters">✕ Clear filters</button>' : ''}
    </div></div>
    ${bulkBar()}
    ${itemsTable(list, INV_COLS.map(c => c[0]), { empty: DB.items.length ? 'No items match the filters.' : 'The party has nothing yet. Click <b>+ Add item</b> to start.' })}
    <p class="small muted">Showing ${list.length} of ${DB.items.length} items${DB.archive.length ? ` · <a class="arclink" data-goto="arc">${DB.archive.length} archived</a>` : ''} · Total party item value ${fmtCp(DB.items.reduce((s, i) => s + itemValue(i), 0))} · Coins ${fmtGp(DB.purses.reduce((s, p) => s + coinValue(p), 0))}</p>`;
}
const CATALOG_TYPES = Array.from(new Set(CATALOG.map(c => c.type).filter(Boolean)));

/* −/+ buttons in the table's Qty column */
function qtyClick(t) {
  const q = t.closest && t.closest('[data-q]'); if (!q) return false;
  const it = getItem(q.dataset.id); if (it) setQty(it, num(it.qty) + num(q.dataset.q));
  return true;
}
/* double-click a row → straight to edit */
function rowDblClick(e) {
  if (e.target.closest('button,input,select,a,[data-q]')) return;
  const tr = e.target.closest('tr[data-item]'); if (tr) openItemEdit(tr.dataset.item);
}
function bindInventory() {
  const root = $('#tab-inv');
  root.addEventListener('dblclick', rowDblClick);
  let qT;
  root.addEventListener('input', e => {
    if (e.target.id === 'fQ') {
      clearTimeout(qT); qT = setTimeout(() => {
        prefs.filters.q = e.target.value; savePrefs();
        const pos = e.target.selectionStart; renderInventory();
        const q = $('#fQ'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) { }
      }, 200);
    }
  });
  root.addEventListener('change', e => {
    const t = e.target, f = prefs.filters;
    const map = { fHolder: 'holder', fType: 'type', fRarity: 'rarity', fMagic: 'magic', fAttune: 'attune', fTag: 'tag' };
    if (map[t.id]) f[map[t.id]] = t.value;
    else if (t.id === 'fNested') f.nested = t.checked;
    else if (t.id === 'sKey') prefs.sort.key = t.value;
    else if (t.id === 'gKey') prefs.group = t.value;
    else if (t.dataset.sel !== undefined) { t.checked ? sel.add(t.dataset.sel) : sel.delete(t.dataset.sel); }
    else if (t.hasAttribute('data-selall')) { filteredItems().forEach(i => t.checked ? sel.add(i.id) : sel.delete(i.id)); }
    else return;
    savePrefs(); renderInventory();
  });
  root.addEventListener('click', e => {
    const t = e.target;
    if (t.matches('input[type=checkbox]')) return;
    const th = t.closest('th[data-sort]');
    if (th) { const k = th.dataset.sort; if (prefs.sort.key === k) prefs.sort.dir *= -1; else { prefs.sort.key = k; prefs.sort.dir = 1; } savePrefs(); renderInventory(); return; }
    if (t.id === 'sDir') { prefs.sort.dir *= -1; savePrefs(); renderInventory(); return; }
    const chip = t.closest('[data-chip]');
    if (chip) { prefs.filters.holder = prefs.filters.holder === chip.dataset.chip ? '' : chip.dataset.chip; prefs.filters.nested = true; savePrefs(); renderInventory(); return; }
    const go = t.closest('[data-goto]'); if (go) { e.preventDefault(); if (go.dataset.goto === 'set') prefs.setTab = 'chars'; showTab(go.dataset.goto); return; }
    const act = t.closest('[data-act]')?.dataset.act;
    if (act) { handleAct(act, t.closest('[data-act]'), root); return; }
    if (qtyClick(t)) return;
    const ub = t.closest('[data-use]'); if (ub) { useOne(getItem(ub.dataset.use)); return; }
    const tr = t.closest('tr[data-item]');
    if (tr) openItem(tr.dataset.item);
  });
}

/* shared actions (inventory + container view) */
function handleAct(act, btn, root) {
  switch (act) {
    case 'newItem': newItem(btn.dataset.holder || (prefs.filters.holder && prefs.filters.holder !== '__none' ? prefs.filters.holder : '')); break;
    case 'clearFilters': prefs.filters = { q: '', holder: '', nested: true, type: '', rarity: '', magic: '', attune: '', tag: '' }; savePrefs(); renderInventory(); break;
    case 'bulkClear': sel.clear(); renderAll(); break;
    case 'bulkMove': {
      const to = $('#bulkTo', root).value; let n = 0;
      sel.forEach(id => { const it = getItem(id); if (it && it.holderId !== to) { logItem('moved', it, { fromId: it.holderId, toId: to }); it.holderId = to; touch(it); n++; } });
      sel.clear(); commit(); toast(`Moved ${n} item${n === 1 ? '' : 's'} to ${holderName(to)}`); break;
    }
    case 'bulkArc': {
      const reason = $('#bulkArReason', root).value, takenBy = $('#bulkArWho', root).value; let n = 0;
      Array.from(sel).forEach(id => { const it = getItem(id); if (it) { archiveItem(it, { reason, takenBy, contents: 'drop' }); n++; } });
      sel.clear(); commit(); toast(`Archived ${n} item${n === 1 ? '' : 's'} — ${arcPhrase({ reason, takenBy })}`); break;
    }
    case 'bulkDel': {
      if (!armed(btn, '', `Delete ${sel.size}?`)) return;
      let n = 0; Array.from(sel).forEach(id => { const it = getItem(id); if (it) { deleteItem(it); n++; } });
      sel.clear(); commit(); toast(`Deleted ${n} item${n === 1 ? '' : 's'}`); break;
    }
  }
}

/* =================== ITEM CARD (drawer) =================== */
let drawer = { mode: null, id: null, draft: null, editDesc: false, catQ: '', catSrc: '' };

function blankItem(holderId = '') {
  return { id: '', name: '', qty: 1, weightEach: null, valueCp: null, holderId, type: '', rarity: '', magical: false,
    attunement: false, attuneNote: '', equipped: false, identified: true, charges: null, chargesMax: null,
    tags: '', stats: '', desc: '', notes: '', source: '', catalogIndex: '' };
}
function newItem(holderId) { drawer = { mode: 'new', id: null, draft: blankItem(holderId), editDesc: false, newType: false, newTag: false, catQ: '', catSrc: drawer.catSrc || '' }; renderDrawer(); openDrawer(); setTimeout(() => $('#catQ')?.focus(), 220); }
function openItemEdit(id) { openItem(id); drawer.mode = 'edit'; renderDrawer(); $('#drawer').scrollTop = 0; }
/* change a number straight from the overview / table; logged like an edit */
function setQty(it, q) {
  q = Math.max(0, +num(q).toFixed(4)); if (q === num(it.qty)) return;
  logEdit(it, 'qty', num(it.qty), q); it.qty = q; touch(it); commit();
  if (drawer.mode === 'view' && drawer.id === it.id) renderDrawer();
}
function setCharges(it, c) {
  c = Math.max(0, Math.min(num(it.chargesMax) || Infinity, int(c))); if (c === it.charges) return;
  logEdit(it, 'charges', it.charges, c); it.charges = c; touch(it); commit();
  if (drawer.mode === 'view' && drawer.id === it.id) renderDrawer();
}
function openItem(id) { drawer = { mode: 'view', id, arc: !getItem(id) && !!getArc(id), draft: null, editDesc: false, newType: false, newTag: false, catQ: '', catSrc: drawer.catSrc || '' }; renderDrawer(); openDrawer(); }
function openDrawer() { $('#drawer').classList.add('open'); document.body.classList.add('drawer-open'); }
function closeDrawer() { $('#drawer').classList.remove('open'); document.body.classList.remove('drawer-open'); drawer.mode = null; }
function curItem() { return drawer.mode === 'new' ? drawer.draft : drawer.arc ? getArc(drawer.id) : getItem(drawer.id); }
const linkedLoc = it => it && it.id ? DB.locations.find(l => l.itemId === it.id) : null;

function catStats(c) {
  const p = [];
  if (c.damage) p.push(c.damage + (c.damage_type ? ' ' + c.damage_type : '') + (c.damage2 ? ' (' + c.damage2 + ')' : ''));
  if (c.armor_class) p.push('AC ' + c.armor_class);
  if (c.strength_req) p.push('Str ' + c.strength_req);
  if (c.stealth_disadvantage) p.push('Stealth disadv.');
  if (c.range) p.push('Range ' + c.range);
  if (c.properties && c.properties.length) p.push(c.properties.join(', '));
  return p.join(' · ');
}
function applyCatalog(it, c) {
  Object.assign(it, {
    name: c.name, type: c.type || '', rarity: c.rarity || '', magical: c.item_category === 'Magic',
    attunement: !!c.attunement, attuneNote: c.attunement_note || '', weightEach: c.weight ?? null, valueCp: c.value_cp ?? null,
    desc: c.desc || '', stats: catStats(c), source: [c.source_book, c.page ? 'p. ' + c.page : ''].filter(Boolean).join(', '), catalogIndex: c.index
  });
}
function catalogSearch(q, src) {
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  const res = [];
  for (const c of CATALOG) {
    if (src === '__core' ? !CORE_2014.includes(c.source_book) : (src && c.source_book !== src)) continue;
    const n = c.name.toLowerCase(); const i = n.indexOf(q);
    if (i >= 0) res.push([i === 0 ? 0 : 1, c]);
  }
  return res.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).slice(0, 40).map(x => x[1]);
}
const CAT_BOOKS = Array.from(new Set(CATALOG.map(c => c.source_book))).sort();

function catalogBlock() {
  if (!CATALOG.length) return `<p class="warn">Item catalogue not loaded — put <b>items-data.js</b> next to this file to search 5e items. You can still enter items by hand.</p>`;
  const res = catalogSearch(drawer.catQ, drawer.catSrc);
  return `<div class="sect" style="border-top:none;margin-top:6px">
    <div class="inl"><input id="catQ" placeholder="Search ${CATALOG.length} 5e items… (e.g. rope, longsword, bag of holding)" value="${esc(drawer.catQ)}">
    <select id="catSrc" style="max-width:150px"><option value="">All books</option><option value="__core" ${drawer.catSrc === '__core' ? 'selected' : ''}>Core 2014 (PHB/DMG/MM)</option>${CAT_BOOKS.map(b => `<option ${b === drawer.catSrc ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>
    <div id="catRes">${catResHtml(res)}</div>
    <p class="small muted">Pick an item to fill the card, or just type your own below.</p></div>`;
}
function catResHtml(res) {
  if (!drawer.catQ || drawer.catQ.trim().length < 2) return '';
  if (!res.length) return '<div class="catres"><div class="muted">No catalogue match — fill in the card by hand.</div></div>';
  return '<div class="catres">' + res.map(c => `<div data-cat="${esc(c.index)}"><b>${esc(c.name)}</b> <span class="small ${rarClass(c.rarity)}">${esc(c.rarity !== 'Mundane' ? c.rarity : '')}</span>
    <span class="small muted">· ${esc(c.type)}${c.weight ? ' · ' + c.weight + ' lb' : ''}${c.value_display ? ' · ' + esc(c.value_display) : ''}${c.attunement ? ' · ◈' : ''} · ${esc(c.source_abbr || '')}</span></div>`).join('') + '</div>';
}

/* ---- simple read-only overview (first thing you see) ---- */
function renderView(it) {
  const d = $('#drawer');
  const lk = linkedLoc(it);
  const sub = [it.rarity && it.rarity !== 'Mundane' ? `<span class="${rarClass(it.rarity)}">${esc(it.rarity)}</span>` : '', esc(it.type || ''),
    it.attunement ? 'requires attunement' + (it.attuneNote ? ' ' + esc(it.attuneNote) : '') : ''].filter(Boolean).join(' · ');
  const row = (k, v) => v === '' || v == null ? '' : `<dt>${k}</dt><dd>${v}</dd>`;
  const each = (tot, one, f) => num(it.qty) !== 1 && one ? `${f(tot)} <span class="muted">(${f(one)} each)</span>` : f(tot);
  const contents = lk ? DB.items.filter(x => x.holderId === lk.id).sort((a, b) => a.name.localeCompare(b.name)) : [];
  const subs = lk ? DB.locations.filter(x => x.parentId === lk.id) : [];
  d.innerHTML = `
  <div class="dr-head"><h3 id="drTitle">${esc(it.name || '(unnamed)')}</h3>
    <button class="gold small" data-dr="edit">✎ Edit</button>
    <button class="ghost" data-dr="close" title="Close (Esc)">✕</button></div>
  <div class="view">
    ${sub ? `<div class="vsub">${sub}</div>` : ''}
    <div>${itemBadges(it)}</div>
    <dl class="vlist">
      ${row('Quantity', `<span class="qtyctl"><button class="small" data-dr="q-" title="One less (a correction — use “Use 1” when it's consumed)">−</button><input id="vQty" type="number" min="0" step="any" value="${esc(+num(it.qty).toFixed(2))}"><button class="small" data-dr="q+" title="One more">+</button></span>${num(it.qty) > 0 ? ` <button class="small${isConsumable(it) ? ' gold' : ''}" data-dr="use" title="Consumed — goes to the archive as used up">Use 1</button>` : ''}`)}
      ${row('Weight', num(it.weightEach) ? each(itemWeight(it), num(it.weightEach), fmtW) : '—')}
      ${row('Value', num(it.valueCp) ? each(itemValue(it), num(it.valueCp), fmtCp) : '—')}
      ${row('Carried by', esc(holderLabel(it.holderId)))}
      ${num(it.chargesMax) ? row('Charges', `<span class="qtyctl"><button class="small" data-dr="chg-" title="Use a charge">−</button><input id="vChg" type="number" min="0" max="${int(it.chargesMax)}" value="${int(it.charges)}"><button class="small" data-dr="chg+" title="Regain a charge">+</button> <span class="muted">/ ${int(it.chargesMax)}</span></span>`) : ''}
      ${row('Stats', esc(it.stats || ''))}
      ${row('Tags', esc(it.tags || ''))}
      ${row('Source', esc(it.source || ''))}
    </dl>
    ${lk ? `<div class="sect"><h4>▣ Contents · ${holderCount(lk.id)} item(s) · ${fmtW(holderContentsWeight(lk.id))}${lk.weightless ? ' (weightless)' : ''}</h4>
      ${contents.length || subs.length ? `<ul class="vcont">${subs.map(x => `<li>${LOC_ICON[x.kind] || ''} ${esc(x.name)}</li>`).join('')}${contents.map(x => `<li><a data-goitem="${esc(x.id)}">${esc(x.name)}</a>${num(x.qty) !== 1 ? ' × ' + esc(+num(x.qty).toFixed(2)) : ''}</li>`).join('')}</ul>` : '<p class="muted small">Empty.</p>'}
      <div class="toolbar"><button class="small" data-dr="addInto">+ Put an item in it</button><button class="small" data-dr="openCont">Open container view</button></div></div>` : ''}
    <div class="sect"><h4>Description</h4><div class="desc">${it.desc ? esc(it.desc) : '<span class="muted">No description.</span>'}</div></div>
    ${it.notes ? `<div class="sect"><h4>Group notes</h4><div class="desc">${esc(it.notes)}</div></div>` : ''}
    <div class="sect"><h4>Move / give</h4>
      <div class="toolbar"><input id="trQty" type="number" min="0" step="any" value="${esc(it.qty)}" style="width:70px"> to
      <select id="trTo" style="flex:1;min-width:0">${holderOptions('', { exclude: new Set([it.holderId, ...ownCont(it)]) })}</select><button data-dr="transfer">Move</button></div></div>
    ${archiveForm(it)}
    ${historyBlock(it)}
    <p class="small muted">${it.updatedAt > 1000 ? 'Changed ' + esc(fmtTime(it.updatedAt)) + (it.updatedBy ? ' by ' + esc(it.updatedBy) : '') : ''}</p>
  </div>`;
}

function renderDrawer() {
  const it = curItem();
  if (it && drawer.arc) { drawer.mode = 'view'; renderArcView(it); return; }
  if (it && drawer.mode === 'view') { renderView(it); return; }
  const d = $('#drawer');
  if (!it) { closeDrawer(); return; }
  const isNew = drawer.mode === 'new';
  const vp = valueParts(it.valueCp);
  d.innerHTML = `
  <div class="dr-head"><h3 id="drTitle">${isNew ? 'New item' : esc(it.name || '(unnamed)')}</h3>
    ${isNew ? '' : '<button class="gold small" data-dr="done" title="Back to the overview">✓ Done</button>'}
    <button class="ghost" data-dr="close" title="Close (Esc)">✕</button></div>
  ${isNew ? catalogBlock() : ''}
  <div class="fgrid">
    <label class="f full">Name <input data-f="name" value="${esc(it.name)}" placeholder="Item name"></label>
    <label class="f">Quantity <input data-f="qty" type="number" step="any" min="0" value="${esc(it.qty)}"></label>
    <label class="f">Weight each (lb) <input data-f="weightEach" type="number" step="any" min="0" value="${esc(it.weightEach ?? '')}"></label>
    <label class="f">Value each <span class="inl"><input data-f="valueN" type="number" step="any" min="0" value="${esc(vp.v)}">
      <select data-f="valueU" style="flex:none">${['cp', 'sp', 'gp', 'pp'].map(u => `<option ${u === vp.u ? 'selected' : ''}>${u}</option>`).join('')}</select></span></label>
    <div class="f">Totals <div class="small" id="drTotals" style="padding:6px 0;color:var(--ink)">${fmtW(itemWeight(it))} · ${fmtCp(itemValue(it))}</div></div>
    <label class="f full">Carried by / Location <select data-f="holderId">${holderOptions(it.holderId, { exclude: ownCont(it) })}</select></label>
    <label class="f">Type ${typePicker(it)}</label>
    <label class="f">Rarity <select data-f="rarity"><option value="">—</option>${RARITIES.map(r => `<option ${r === it.rarity ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
    <div class="full checks">
      <label><input type="checkbox" data-f="magical" ${it.magical ? 'checked' : ''}> Magical</label>
      <label><input type="checkbox" data-f="attunement" ${it.attunement ? 'checked' : ''}> Requires attunement</label>
      <label><input type="checkbox" data-f="identified" ${it.identified !== false ? 'checked' : ''}> Identified</label>
      <label><input type="checkbox" data-f="equipped" ${it.equipped ? 'checked' : ''}> Equipped / in use</label>
    </div>
    ${it.attunement ? `
    <label class="f full">Attunement requirement <input data-f="attuneNote" value="${esc(it.attuneNote)}" placeholder="e.g. by a wizard"></label>` : ''}
    <label class="f">Charges <span class="inl"><input data-f="charges" type="number" min="0" value="${esc(it.charges ?? '')}" placeholder="now"> / <input data-f="chargesMax" type="number" min="0" value="${esc(it.chargesMax ?? '')}" placeholder="max"></span></label>
    <div class="f">Tags ${tagPicker(it)}</div>
    <label class="f full">Stats <input data-f="stats" value="${esc(it.stats)}" placeholder="e.g. 1d8 slashing · Versatile (1d10)"></label>
  </div>
  <div class="sect"><h4>Description</h4><textarea data-f="desc" rows="9" placeholder="What the item does…">${esc(it.desc)}</textarea></div>
  <div class="sect"><h4>Group notes</h4><textarea data-f="notes" rows="3" placeholder="Where we found it, who wants it, plans to sell…">${esc(it.notes)}</textarea></div>
  <label class="f" style="margin-top:8px">Source <input data-f="source" value="${esc(it.source)}"></label>
  ${isNew ? `
  <div class="sect toolbar"><button class="gold" data-dr="add">Add to inventory</button><button data-dr="close">Cancel</button></div>` : `
  <div class="sect"><h4>Container</h4>${(() => { const lk = linkedLoc(it);
    return lk ? `<div class="toolbar"><span class="small">▣ Holds ${holderCount(lk.id)} item(s)</span>
        <label class="small"><input type="checkbox" data-dr-weightless ${lk.weightless ? 'checked' : ''}> contents weightless</label>
        <label class="small">capacity <input type="number" min="0" step="any" data-dr-cap value="${esc(lk.capacity ?? '')}" style="width:70px"> lb</label></div>
        <div class="toolbar" style="margin-top:6px"><button data-dr="unCont" class="danger">Stop being a container</button><span class="small muted">Anything inside is moved to ${esc(holderName(it.holderId))}.</span></div>`
      : `<div class="toolbar"><button data-dr="makeCont">Make this a container</button><span class="small muted">Backpack, chest, Bag of Holding… other items can then be stored inside it.</span></div>`; })()}</div>
  <div class="sect toolbar"><button data-dr="dup">Duplicate</button><button data-dr="del" class="danger">Delete item</button>
    <span class="spacer"></span><span class="small muted">${it.updatedAt > 1000 ? 'Changed ' + esc(fmtTime(it.updatedAt)) + (it.updatedBy ? ' by ' + esc(it.updatedBy) : '') : ''}</span></div>`}`;
}

/* Type: a real dropdown (no browser text-filtering), with "+ New type…" */
function typePicker(it) {
  const list = vocabList('type').map(v => v.name);
  if (it.type && !list.some(n => n.toLowerCase() === it.type.toLowerCase())) list.push(it.type);
  if (drawer.newType) return `<span class="inl"><input id="newType" placeholder="New type name"><button class="small gold" data-dr="addType">Add</button><button class="small ghost" data-dr="cancelType">✕</button></span>`;
  return `<select data-f="type"><option value="">—</option>${list.sort((a, b) => a.localeCompare(b)).map(n => `<option ${n === it.type ? 'selected' : ''}>${esc(n)}</option>`).join('')}<option value="__new">+ New type…</option></select>`;
}
/* Tags: chips you can remove + a dropdown to add one (or a new one) */
function tagPicker(it) {
  const have = itemTags(it), lc = have.map(t => t.toLowerCase());
  const avail = vocabList('tag').map(v => v.name).filter(n => !lc.includes(n.toLowerCase()));
  const chips = have.map(t => `<span class="tchip">${esc(t)}<button class="ghost" data-dr="rmTag" data-tag="${esc(t)}" title="Remove tag">✕</button></span>`).join('');
  const add = drawer.newTag
    ? `<span class="inl"><input id="newTag" placeholder="New tag"><button class="small gold" data-dr="addTag">Add</button><button class="small ghost" data-dr="cancelTag">✕</button></span>`
    : `<select id="tagSel"><option value="">+ Add tag…</option>${avail.map(n => `<option>${esc(n)}</option>`).join('')}<option value="__new">+ New tag…</option></select>`;
  return `<div class="tagbox">${chips}${add}</div>`;
}
function setTags(it, list) {
  const old = it.tags || '', nw = Array.from(new Set(list.map(s => s.trim()).filter(Boolean))).join(', ');
  if (old === nw) return;
  it.tags = nw;
  if (drawer.mode === 'edit') { logEdit(it, 'tags', old, nw); touch(it); commit(); }
}
/* an item that is a container can't be put inside itself */
function ownCont(it) {
  const lk = it.id && DB.locations.find(l => l.itemId === it.id);
  if (!lk) return new Set(); const s = descendantsOf(lk.id); s.add(lk.id); return s;
}
function readField(it, el) {
  const f = el.dataset.f;
  switch (f) {
    case 'qty': it.qty = Math.max(0, num(el.value, 0)); break;
    case 'weightEach': it.weightEach = el.value === '' ? null : Math.max(0, num(el.value)); break;
    case 'valueN': case 'valueU': {
      const n = $('[data-f=valueN]', $('#drawer')).value, u = $('[data-f=valueU]', $('#drawer')).value;
      it.valueCp = n === '' ? null : Math.round(num(n) * COIN_CP[u]); break;
    }
    case 'charges': case 'chargesMax': it[f] = el.value === '' ? null : int(el.value); break;
    case 'magical': case 'attunement': case 'equipped': case 'identified': it[f] = el.checked; break;
    default: it[f] = el.value;
  }
}

function bindDrawer() {
  const d = $('#drawer');
  d.addEventListener('change', e => {
    const el = e.target;
    if (el.hasAttribute('data-dr-weightless') || el.hasAttribute('data-dr-cap')) {
      const lk = linkedLoc(curItem()); if (!lk) return;
      if (el.hasAttribute('data-dr-weightless')) lk.weightless = el.checked; else lk.capacity = el.value === '' ? null : num(el.value);
      touch(lk); commit(); return;
    }
    if (el.dataset.f === 'type' && el.value === '__new') { drawer.newType = true; renderDrawer(); setTimeout(() => $('#newType')?.focus(), 10); return; }
    if (el.id === 'tagSel') {
      const it = curItem(); if (!it) return;
      if (el.value === '__new') { drawer.newTag = true; renderDrawer(); setTimeout(() => $('#newTag')?.focus(), 10); return; }
      if (el.value) { setTags(it, [...itemTags(it), el.value]); renderDrawer(); }
      return;
    }
    if (el.id === 'vQty' || el.id === 'vChg') { const it = curItem(); if (it) (el.id === 'vQty' ? setQty : setCharges)(it, el.value); return; }
    if (!el.dataset.f) return;
    const it = curItem(); if (!it) return;
    const fk = el.dataset.f === 'valueN' || el.dataset.f === 'valueU' ? 'valueCp' : el.dataset.f;
    const before = it[fk];
    readField(it, el);
    if (drawer.mode === 'edit' && JSON.stringify(before) !== JSON.stringify(it[fk])) {
      if (fk === 'holderId') logItem('moved', it, { fromId: before, toId: it.holderId }); else logEdit(it, fk, before, it[fk]);
    }
    const rerender = ['attunement', 'qty'].includes(el.dataset.f);
    if (drawer.mode === 'edit') { touch(it); commit(); }
    if (rerender) renderDrawer();
    else { $('#drTotals') && ($('#drTotals').textContent = `${fmtW(itemWeight(it))} · ${fmtCp(itemValue(it))}`); if (el.dataset.f === 'name' && drawer.mode === 'edit') $('#drTitle').textContent = it.name || '(unnamed)'; }
  });
  let cT;
  d.addEventListener('input', e => {
    if (e.target.id === 'catQ') {
      drawer.catQ = e.target.value; clearTimeout(cT);
      cT = setTimeout(() => { const r = $('#catRes'); if (r) r.innerHTML = catResHtml(catalogSearch(drawer.catQ, drawer.catSrc)); }, 120);
    }
  });
  d.addEventListener('change', e => {
    if (e.target.id === 'catSrc') { drawer.catSrc = e.target.value; $('#catRes').innerHTML = catResHtml(catalogSearch(drawer.catQ, drawer.catSrc)); }
  });
  d.addEventListener('keydown', e => {
    if ((e.target.id === 'vQty' || e.target.id === 'vChg') && e.key === 'Enter') e.target.blur();
    if (e.target.id === 'newType' && e.key === 'Enter') { e.preventDefault(); d.querySelector('[data-dr=addType]').click(); }
    if (e.target.id === 'newTag' && e.key === 'Enter') { e.preventDefault(); d.querySelector('[data-dr=addTag]').click(); }
    if (e.target.id === 'catQ' && e.key === 'Enter') { const first = $('[data-cat]', d); if (first) first.click(); }
  });
  d.addEventListener('click', e => {
    const cat = e.target.closest('[data-cat]');
    if (cat) {
      const c = CAT_BY_INDEX.get(cat.dataset.cat); if (!c) return;
      const keep = { qty: drawer.draft.qty, holderId: drawer.draft.holderId, notes: drawer.draft.notes, tags: drawer.draft.tags };
      applyCatalog(drawer.draft, c); Object.assign(drawer.draft, keep);
      drawer.catQ = ''; renderDrawer(); $('[data-f=qty]', d)?.focus(); return;
    }
    const gi = e.target.closest('[data-goitem]'); if (gi) { openItem(gi.dataset.goitem); return; }
    const b = e.target.closest('[data-dr]'); if (!b) return;
    const it = curItem();
    switch (b.dataset.dr) {
      case 'close': closeDrawer(); break;
      case 'addType': {
        const n = $('#newType').value.trim(); drawer.newType = false;
        if (n) { const v = addVocab('type', n); const old = it.type; it.type = v.name; if (drawer.mode === 'edit' && old !== it.type) { logEdit(it, 'type', old, it.type); touch(it); } commit(); }
        renderDrawer(); break;
      }
      case 'cancelType': drawer.newType = false; renderDrawer(); break;
      case 'addTag': {
        const n = $('#newTag').value.trim(); drawer.newTag = false;
        if (n) { const v = addVocab('tag', n); setTags(it, [...itemTags(it), v.name]); if (drawer.mode !== 'edit') commit({ keep: [prefs.tab] }); }
        renderDrawer(); break;
      }
      case 'cancelTag': drawer.newTag = false; renderDrawer(); break;
      case 'rmTag': setTags(it, itemTags(it).filter(t => t !== b.dataset.tag)); renderDrawer(); break;
      case 'edit': drawer.mode = 'edit'; renderDrawer(); d.scrollTop = 0; break;
      case 'done': drawer.mode = 'view'; renderDrawer(); d.scrollTop = 0; break;
      case 'chg-': case 'chg+': setCharges(it, int(it.charges) + (b.dataset.dr === 'chg+' ? 1 : -1)); break;
      case 'q-': case 'q+': setQty(it, num(it.qty) + (b.dataset.dr === 'q+' ? 1 : -1)); break;
      case 'addInto': { const lk = linkedLoc(it); if (lk) newItem(lk.id); break; }
      case 'unCont': {
        if (!armed(b)) return;
        const lk = linkedLoc(it); if (!lk) return;
        removeLocation(lk.id, it.holderId); logItem('container', it, { text: 'no longer a container — contents moved to ' + holderLabel(it.holderId) }); commit(); renderDrawer(); toast(`${it.name} is no longer a container`); break;
      }
      case 'add': {
        if (!it.name.trim()) { $('[data-f=name]', d).focus(); toast('Give the item a name first'); return; }
        // stack onto an identical plain item at the same holder
        const twin = DB.items.find(x => x.name === it.name && x.holderId === it.holderId && (x.catalogIndex || '') === (it.catalogIndex || '')
          && !num(x.chargesMax) && !num(it.chargesMax) && (x.notes || '') === '' && (it.notes || '') === '');
        if (twin) { twin.qty = num(twin.qty) + num(it.qty); touch(twin); logItem('added', twin, { qty: num(it.qty), toId: twin.holderId, text: `+${num(it.qty)} to ${holderLabel(twin.holderId)} (stack now ${twin.qty})` }); toast(`Stacked with existing ${twin.name} (now ${twin.qty})`); }
        else { const n = Object.assign({}, it, { id: uid('it'), createdAt: now() }); touch(n); DB.items.push(n); logItem('added', n, { toId: n.holderId }); toast(`Added ${n.name} → ${holderName(n.holderId)}`); }
        commit();
        const h = it.holderId; newItem(h); // keep drawer open for fast entry
        break;
      }
      case 'transfer': {
        const q = num($('#trQty', d).value), to = $('#trTo', d).value;
        if (q <= 0) return;
        logItem('moved', it, { qty: Math.min(q, num(it.qty)), fromId: it.holderId, toId: to });
        if (q >= num(it.qty)) { it.holderId = to; touch(it); }
        else {
          it.qty = +(num(it.qty) - q).toFixed(4); touch(it);
          const twin = DB.items.find(x => x.id !== it.id && x.name === it.name && x.holderId === to && (x.catalogIndex || '') === (it.catalogIndex || ''));
          if (twin) { twin.qty = num(twin.qty) + q; touch(twin); }
          else { const n = Object.assign({}, it, { id: uid('it'), qty: q, holderId: to, equipped: false, createdAt: now() }); touch(n); DB.items.push(n); }
        }
        commit(); renderDrawer(); toast(`Moved ${q} × ${it.name} to ${holderName(to)}`); break;
      }
      case 'makeCont': {
        const l = { id: 'loc_' + it.id, name: it.name, kind: 'container', parentId: it.holderId, capacity: null, selfWeight: 0,
          weightless: /holding|haversack|portable hole|bag of tricks/i.test(it.name), notes: '', order: now(), itemId: it.id };
        touch(l); DB.locations.push(l); logItem('container', it, { text: 'made into a container' }); commit(); renderDrawer(); toast(`${it.name} can now hold items`); break;
      }
      case 'openCont': { const lk = DB.locations.find(l => l.itemId === it.id); if (lk) { closeDrawer(); openLoc = lk.id; showTab('loc'); } break; }
      case 'dup': { const n = Object.assign({}, it, { id: uid('it'), createdAt: now() }); touch(n); DB.items.push(n); logItem('added', n, { toId: n.holderId, text: 'duplicated, at ' + holderLabel(n.holderId) }); commit(); openItem(n.id); toast('Duplicated'); break; }
      case 'use': if (!drawer.arc && drawer.mode === 'view') useOne(it); break;
      case 'archive': {
        if (drawer.arc || drawer.mode === 'new') return;
        const o = { qty: $('#arQty', d) ? num($('#arQty', d).value) : num(it.qty), reason: $('#arReason', d).value, takenBy: $('#arWho', d).value,
          note: $('#arNote', d).value, contents: ($('input[name=arCont]:checked', d) || {}).value };
        if (o.qty <= 0) { $('#arQty', d)?.focus(); return; }
        const rec = archiveItem(it, o); commit();
        if (getItem(it.id)) renderDrawer(); else closeDrawer();
        toast(`${+num(rec.qty).toFixed(2)} × ${rec.name} archived — ${arcPhrase(rec.archived)}`); break;
      }
      case 'reactivate': {
        if (!drawer.arc) return;
        const dest = $('#axDest', d).value, res = reactivateItem(it, dest); commit(); openItem(res.id);
        toast(`${it.name} is back at ${holderName(dest)}`); break;
      }
      case 'purge': {
        if (!drawer.arc || !armed(b, '', 'Delete for good?')) return;
        purgeArchived(it); closeDrawer(); commit(); toast(`${it.name} deleted permanently`); break;
      }
      case 'del': {
        if (!armed(b)) return;
        const lk = linkedLoc(it);
        deleteItem(it); closeDrawer(); commit(); toast(`Deleted ${it.name}${lk ? ' — its contents were moved to ' + holderName(it.holderId) : ''}`); break;
      }
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#drawer').classList.contains('open')) closeDrawer(); });
}

/* =================== ARCHIVE ===================
   Items that leave the party's books (to a character sheet, sold, lost…) move from DB.items to DB.archive
   with the same id and all their fields, plus `archived` = { at, by, reason, takenBy, note, fromId, fromName,
   srcId (when split off a stack), withId (when archived inside a container), locs (container snapshot) }.
   holderId is always ARCHIVE_ID while archived, so it counts nowhere. */
const ARCHIVE_ID = '__archive';
const ARC_REASONS = { sheet: 'To character sheet', sold: 'Sold', lost: 'Lost / stolen', used: 'Used up', destroyed: 'Destroyed', gift: 'Given away', other: 'Other' };
const getArc = id => DB.archive.find(x => x.id === id);

function arcPhrase(a) {
  const who = a.takenBy ? holderName(a.takenBy) : '';
  switch (a.reason) {
    case 'sheet': return who ? `to ${who}'s sheet` : 'to a character sheet';
    case 'sold': return 'sold' + (who ? ` by ${who}` : '');
    case 'lost': return 'lost' + (who ? ` by ${who}` : '');
    case 'used': return 'used up' + (who ? ` by ${who}` : '');
    case 'destroyed': return 'destroyed';
    case 'gift': return 'given away' + (who ? ` by ${who}` : '');
    default: return 'archived' + (who ? ` (${who})` : '');
  }
}
/* coins kept in locations that disappear go to the Party Fund (same as deleting a location) */
function coinsToParty(locIds) {
  let moved = 0;
  DB.purses.filter(p => locIds.has(p.holderId)).forEach(pu => {
    if (coinValue(pu)) { const pf = ensurePurse('party'); COINS.forEach(c => pf[c] = int(pf[c]) + int(pu[c])); touch(pf); moved += coinValue(pu); }
    DB.purses = DB.purses.filter(x => x !== pu); tombstone(pu.id);
  });
  return moved;
}

/* o: { qty, reason, takenBy, note, contents: 'drop' | 'with' } → the archived record */
function archiveItem(it, o = {}) {
  const lk = linkedLoc(it);
  const total = num(it.qty);
  const q = lk ? total : Math.min(Math.max(num(o.qty, total), 0) || total, total);
  const info = { at: now(), by: meName(), reason: ARC_REASONS[o.reason] ? o.reason : 'other', takenBy: o.takenBy || '', note: (o.note || '').trim(),
    fromId: it.holderId, fromName: holderLabel(it.holderId) };
  let rec;
  if (q < total) {                                   // part of a stack: the rest stays active
    it.qty = +(total - q).toFixed(4); touch(it);
    rec = Object.assign(clone(it), { id: uid('it'), qty: q, equipped: false });
    info.srcId = it.id;
  } else {
    rec = it; DB.items = DB.items.filter(x => x !== it); sel.delete(it.id);
  }
  let extra = '';
  if (lk) {
    const coins = new Set();
    if (o.contents === 'with') {                     // the container goes with everything inside it
      const ids = descendantsOf(lk.id); ids.add(lk.id);
      const inside = DB.items.filter(x => ids.has(x.holderId));
      inside.forEach(x => {
        x.archived = { at: info.at, by: info.by, reason: info.reason, takenBy: info.takenBy, note: '', fromId: x.holderId, fromName: holderLabel(x.holderId), withId: rec.id };
        x.holderId = ARCHIVE_ID; touch(x); sel.delete(x.id);
      });
      DB.items = DB.items.filter(x => !inside.includes(x));
      DB.archive.push(...inside);
      info.locs = clone(DB.locations.filter(l => ids.has(l.id)));
      info.withCount = inside.length;
      DB.locations = DB.locations.filter(l => !ids.has(l.id));
      ids.forEach(i => coins.add(i));
      extra = inside.length ? ` · with ${inside.length} item${inside.length === 1 ? '' : 's'} inside` : '';
    } else {                                          // contents fall out to whoever carried it
      let n = 0;
      DB.items.forEach(x => { if (x.holderId === lk.id) { x.holderId = info.fromId; touch(x); n++; } });
      DB.locations.forEach(x => { if (x.parentId === lk.id) { x.parentId = info.fromId; touch(x); n++; } });
      info.locs = [clone(lk)];
      DB.locations = DB.locations.filter(l => l !== lk);
      coins.add(lk.id);
      extra = n ? ` · contents moved to ${info.fromName || 'Unassigned'}` : '';
    }
    const cp = coinsToParty(coins);
    if (cp) extra += ` · ${fmtCp(cp)} in coins moved to the Party Fund`;
    if (openLoc && !getLoc(openLoc)) openLoc = '';
  }
  rec.holderId = ARCHIVE_ID; rec.archived = info; touch(rec);
  DB.archive.push(rec);
  logItem('archived', rec, { qty: q, relId: info.srcId || '', fromId: info.fromId, note: info.note,
    text: `${arcPhrase(info)} · from ${info.fromName || 'Unassigned'}${info.srcId ? ` (${+num(it.qty).toFixed(2)} left there)` : ''}${extra}` });
  return rec;
}

/* bring it back; returns the active item it ended up as */
function reactivateItem(rec, dest) {
  const a = rec.archived || {};
  const src = a.srcId && getItem(a.srcId);
  DB.archive = DB.archive.filter(x => x !== rec);
  let result, text;
  if (src && src.holderId === dest) {               // back onto the stack it was split from
    src.qty = +(num(src.qty) + num(rec.qty)).toFixed(4); touch(src);
    result = src; text = `returned to ${holderLabel(dest)} (stack now ${src.qty})`;
  } else {
    delete rec.archived; rec.holderId = dest; touch(rec); DB.items.push(rec); result = rec;
    text = `returned to ${holderLabel(dest)}`;
    if (a.locs && a.locs.length) {                  // it was a container: rebuild it (and what was archived inside it)
      a.locs.forEach(l => { if (getLoc(l.id)) return; const nl = clone(l); if (nl.itemId === rec.id) nl.parentId = dest; touch(nl); DB.locations.push(nl); });
      const inside = DB.archive.filter(x => x.archived && x.archived.withId === rec.id);
      inside.forEach(x => { const f = x.archived.fromId; delete x.archived; x.holderId = getLoc(f) ? f : dest; touch(x); });
      DB.archive = DB.archive.filter(x => !inside.includes(x));
      DB.items.push(...inside);
      if (inside.length) text += ` with ${inside.length} item${inside.length === 1 ? '' : 's'} inside`;
    }
  }
  logEvent('returned', { itemId: result.id, itemName: rec.name, qty: num(rec.qty), relId: rec.id !== result.id ? rec.id : '', toId: dest, text });
  return result;
}
/* where Reactivate suggests: the stack it came from, else where it was, else unassigned */
function arcDefaultDest(rec) {
  const a = rec.archived || {}, src = a.srcId && getItem(a.srcId);
  if (src) return src.holderId;
  if (!a.fromId || a.fromId === 'party' || getPlayer(a.fromId) || getLoc(a.fromId)) return a.fromId || '';
  return '';
}
function purgeArchived(rec) {
  DB.archive = DB.archive.filter(x => x !== rec); tombstone(rec.id);
  DB.archive.forEach(x => { if (x.archived && x.archived.withId === rec.id) { x.archived.withId = ''; touch(x); } });
  logEvent('deleted', { itemId: rec.id, itemName: rec.name, qty: num(rec.qty), text: 'deleted permanently from the archive' });
}
/* everything the log knows about this item (and the stack it was split from / into) */
function itemHistory(it) {
  const ids = new Set([it.id]); if (it.archived && it.archived.srcId) ids.add(it.archived.srcId);
  return DB.log.filter(e => ids.has(e.itemId) || ids.has(e.relId)).sort((a, b) => num(b.ts) - num(a.ts));
}
function historyBlock(it) {
  const h = itemHistory(it); if (!h.length) return '';
  return `<details class="sect hist"><summary><h4>History · ${h.length}</h4></summary><ul class="hlist">${h.slice(0, 60).map(e =>
    `<li><span class="small muted">${esc(fmtTime(e.ts))}${e.by ? ' · ' + esc(e.by) : ''}</span> <span class="lgt lg-${esc(e.action)}">${esc(LOG_TYPES[e.action] || e.action)}</span> ${esc(logDetail(e))}${e.qty && e.qty !== 1 && e.action !== 'edited' ? ` <span class="muted">× ${esc(+num(e.qty).toFixed(2))}</span>` : ''}${e.note ? ` <i class="small">— ${esc(e.note)}</i>` : ''}</li>`).join('')}</ul></details>`;
}

    <div class="sect"><h4>Description</h4><div class="desc">${it.desc ? esc(it.desc) : '<span class="muted">No description.</span>'}</div></div>

}

/* =================== ARCHIVE TAB =================== */
function filteredArchive() {
  const f = prefs.arcf, q = (f.q || '').trim().toLowerCase();
  return DB.archive.filter(it => {
    const a = it.archived || {};
    if (f.reason && a.reason !== f.reason) return false;
    if (f.who && (a.takenBy || '') !== (f.who === '__none' ? '' : f.who)) return false;
    if (q && ![it.name, it.type, it.tags, a.note, a.fromName, ARC_REASONS[a.reason], a.takenBy ? holderName(a.takenBy) : '', a.by].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((x, y) => (num(x.archived?.at) - num(y.archived?.at)) * (f.dir || -1) || (x.name || '').localeCompare(y.name || ''));
}
function renderArchive() {
  const f = prefs.arcf, list = filteredArchive();
  const active = f.q || f.reason || f.who;
  $('#tab-arc').innerHTML = `
  <div class="panel"><div class="toolbar">
    <input type="search" id="axQ" placeholder="Search name, note, who…" value="${esc(f.q || '')}">
    <label>Reason <select id="axFReason"><option value="">All</option>${Object.entries(ARC_REASONS).map(([k, l]) => `<option value="${k}" ${k === f.reason ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label>Who <select id="axFWho"><option value="">Everyone</option><option value="__none" ${f.who === '__none' ? 'selected' : ''}>— nobody —</option>${sortedPlayers().map(p => `<option value="${esc(p.id)}" ${p.id === f.who ? 'selected' : ''}>${esc(p.name || '(unnamed)')}</option>`).join('')}</select></label>
    <button class="small" id="axDir" title="Toggle order">${(f.dir || -1) < 0 ? 'Newest first ▼' : 'Oldest first ▲'}</button>
    ${active ? '<button class="ghost small" data-ax="clear">✕ Clear filters</button>' : ''}
  </div></div>
  <div class="tablewrap"><table class="itable arct"><thead><tr><th class="nosort">Name</th><th class="nosort c">Quantity</th><th class="nosort c">Value</th><th class="nosort">Reason</th><th class="nosort">Who</th><th class="nosort">Came from</th><th class="nosort">Archived</th><th class="nosort">Note</th><th class="nosort"></th></tr></thead>
  <tbody>${list.length ? list.map(it => { const a = it.archived || {}; return `<tr class="item" data-arc="${esc(it.id)}">
    <td><span class="iname">${esc(it.name || '(unnamed)')}</span>${it.magical ? '<span class="badge b-magic">✦ magic</span>' : ''}${a.withId ? `<div class="small muted">↳ inside ${esc(getArc(a.withId)?.name || 'a container')}</div>` : ''}${a.locs && a.locs.length && !a.withId ? `<span class="badge" style="color:var(--gold)">▣</span>` : ''}</td>
    <td class="num c">${esc(+num(it.qty).toFixed(2))}</td><td class="num c">${fmtCp(itemValue(it))}</td>
    <td class="small">${esc(ARC_REASONS[a.reason] || '')}</td><td class="small">${esc(a.takenBy ? holderName(a.takenBy) : '')}</td>
    <td class="small">${esc(a.fromName || '')}</td><td class="small nowrap">${esc(fmtTime(a.at))}${a.by ? `<div class="muted">${esc(a.by)}</div>` : ''}</td>
    <td class="small"><i>${esc(a.note || '')}</i></td>
    <td><button class="small" data-ax="back" data-id="${esc(it.id)}" title="Choose where it goes back to">↩ Reactivate…</button></td></tr>`; }).join('')
    : `<tr><td colspan="9" class="empty">${DB.archive.length ? 'Nothing matches the filters.' : 'Nothing archived yet. Use <b>Archive</b> on an item card when something goes to a character sheet, is sold, lost or used up.'}</td></tr>`}</tbody></table></div>
  <p class="small muted">${list.length} of ${DB.archive.length} archived · not counted in weights or totals${list.length ? ` · value of shown ${fmtCp(list.reduce((s, i) => s + itemValue(i), 0))}` : ''}</p>`;
}
function bindArchive() {
  const root = $('#tab-arc'); let qT;
  root.addEventListener('input', e => {
    if (e.target.id !== 'axQ') return;
    clearTimeout(qT); qT = setTimeout(() => { prefs.arcf.q = e.target.value; savePrefs(); const pos = e.target.selectionStart; renderArchive(); const q = $('#axQ'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) { } }, 200);
  });
  root.addEventListener('change', e => {
    if (e.target.id === 'axFReason') prefs.arcf.reason = e.target.value;
    else if (e.target.id === 'axFWho') prefs.arcf.who = e.target.value;
    else return;
    savePrefs(); renderArchive();
  });
  root.addEventListener('click', e => {
    if (e.target.id === 'axDir') { prefs.arcf.dir = (prefs.arcf.dir || -1) * -1; savePrefs(); renderArchive(); return; }
    const b = e.target.closest('[data-ax]');
    if (b && b.dataset.ax === 'clear') { prefs.arcf = { q: '', reason: '', who: '', dir: prefs.arcf.dir || -1 }; savePrefs(); renderArchive(); return; }
    if (b && b.dataset.ax === 'back') { openItem(b.dataset.id); setTimeout(() => { $('#arcBack')?.scrollIntoView({ block: 'center' }); $('#axDest')?.focus(); }, 230); return; }
    const tr = e.target.closest('tr[data-arc]'); if (tr) openItem(tr.dataset.arc);
  });
  // editing reason / who / note on an archived card
  $('#drawer').addEventListener('change', e => {
    if (!drawer.arc) return;
    const it = getArc(drawer.id); if (!it || !it.archived) return;
    const el = e.target, a = it.archived;
    if (el.id === 'axReason') a.reason = el.value;
    else if (el.id === 'axWho') a.takenBy = el.value;
    else if (el.id === 'axNote') a.note = el.value.trim();
    else if (el.id === 'axDest') {
      const src = a.srcId && getItem(a.srcId), h = $('#axHint');
      if (h && src) h.textContent = src.holderId === el.value ? `Adds back onto the stack of ${+num(src.qty).toFixed(2)} at ${holderLabel(src.holderId)}.` : `Comes back as its own stack (the other ${+num(src.qty).toFixed(2)} are at ${holderLabel(src.holderId)}).`;
      return;
    } else return;
    it.archived = Object.assign({}, a); touch(it); commit({ keep: [] });
  });
}
